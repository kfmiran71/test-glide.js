<body>

          </div>
        </div>
      </div>

<script>
const params = new URLSearchParams(window.location.search);

function firstParam(names) {

  for (const name of names) {
    const value = params.get(name);

    if (value) {
      return value.trim();
    }
  }

  return "";

}

const stop = firstParam(["stop", "stopId", "platformId", "stationId"]);
const route = firstParam(["route", "routeId", "line", "train"]);
const resultsEl = document.getElementById("results");
const pullRefreshIndicator = document.getElementById("pullRefreshIndicator");
let selectedStopBase = stop ? stop.replace(/N$|S$/, "") : "";
let selectedRoute = route || "";
let routeWasProvided = Boolean(route);
let selectedBranchKey = firstParam(["branch", "branchKey"]) || "";
let previousSelection = null;
let pullStartY = 0;
let pullDistance = 0;
let isPullTracking = false;
let isPullRefreshing = false;
const PULL_REFRESH_THRESHOLD = 72;
let latestAlerts = {
  N: { alerts: [], feedSample: [], error: "" },
  S: { alerts: [], feedSample: [], error: "" }
};
let loadInFlight = false;
let queuedLoadOptions = null;
let loadSequence = 0;
let hasRenderedArrivals = false;
let lastSuccessfulSelectionKey = "";
let openStationSelectId = "";

function selectionKey() {

  return [
    selectedStopBase || "",
    selectedRoute || "",
    selectedBranchKey || ""
  ].join("|");

}

function setPullRefreshIndicator(state) {

  if (!pullRefreshIndicator) {
    return;
  }

  pullRefreshIndicator.classList.toggle(
    "is-visible",
    state === "pulling" || state === "ready" || state === "refreshing"
  );
  pullRefreshIndicator.classList.toggle("is-ready", state === "ready");
  pullRefreshIndicator.classList.toggle("is-refreshing", state === "refreshing");

  const labels = {
    idle: "Pull to refresh",
    pulling: "Pull to refresh",
    ready: "Release to refresh",
    refreshing: "Refreshing..."
  };

  pullRefreshIndicator.textContent =
    labels[state] || labels.idle;

}

function currentSelection() {

  return {
    branch: selectedBranchKey || "",
    route: selectedRoute || "",
    stop: selectedStopBase || ""
  };

}

function sameSelection(a, b) {

  return Boolean(a && b) &&
    a.branch === b.branch &&
    a.route === b.route &&
    a.stop === b.stop;

}

function rememberCurrentSelection() {

  const snapshot =
    currentSelection();

  if (!snapshot.stop) {
    return;
  }

  if (!sameSelection(snapshot, previousSelection)) {
    previousSelection =
      snapshot;
  }

}

function applySelectionToUrl() {

  const nextParams =
    new URLSearchParams(window.location.search);

  if (selectedStopBase) {
    nextParams.set("stop", selectedStopBase);
  }

  if (selectedRoute) {
    nextParams.set("route", selectedRoute);
  } else {
    nextParams.delete("route");
  }

  if (selectedBranchKey) {
    nextParams.set("branch", selectedBranchKey);
  } else {
    nextParams.delete("branch");
  }

  window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);

}

function navigateToSelection(selection) {

  if (!selection?.stop) {
    return;
  }

  previousSelection =
    null;
  selectedStopBase =
    selection.stop;
  selectedRoute =
    selection.route || "";
  routeWasProvided =
    Boolean(selectedRoute);
  selectedBranchKey =
    selection.branch || "";

  applySelectionToUrl();
  loadArrivals();

}

function currentScrollTop() {

  return window.scrollY ||
    document.documentElement.scrollTop ||
    document.body.scrollTop ||
    0;

}

function maxDocumentScrollTop() {

  const scrollHeight =
    Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    );
  const viewportHeight =
    window.innerHeight || document.documentElement.clientHeight || 0;

  return Math.max(0, scrollHeight - viewportHeight);

}

function restoreDocumentScrollTop(scrollTop) {

  window.requestAnimationFrame(() => {
    window.scrollTo(0, Math.min(scrollTop, maxDocumentScrollTop()));
  });

}

function routeHasBranches(routeId) {

  return routeId === "5" || routeId === "A";

}

function firstDisplayedRoute(uptownGroups, downtownGroups) {

  return uptownGroups[0]?.route || downtownGroups[0]?.route || "";

}

function selectIdFromSwitcherId(id) {

  return id
    .replace("RouteSwitcher", "Select")
    .replace("BranchSwitcher", "Select");

}

function openStationSelect(id) {

  const shell =
    document.querySelector(`[data-select-id="${id}"]`);

  if (!shell) {
    return;
  }

  toggleStationMenu(shell, true);

}

function closeStationMenus(exceptShell = null) {

  document.querySelectorAll(".station-select-wrap.is-open").forEach(wrap => {
    if (!exceptShell || !wrap.contains(exceptShell)) {
      wrap.classList.remove("is-open");
    }
  });

  if (!exceptShell) {
    openStationSelectId =
      "";
  }

}

function toggleStationMenu(shell, forceOpen = null) {

  const wrap =
    shell.closest(".station-select-wrap");

  if (!wrap) {
    return;
  }

  const shouldOpen =
    forceOpen === null ? !wrap.classList.contains("is-open") : forceOpen;

  closeStationMenus(shell);
  wrap.classList.toggle("is-open", shouldOpen);
  openStationSelectId =
    shouldOpen ? shell.dataset.selectId || "" : "";

}

function isStationMenuOpen() {

  return Boolean(openStationSelectId);

}

function getDirectionStops(baseStop) {

  const cleanedStop =
    baseStop.replace(/N$|S$/, "");

  const uptownStop =
    `${cleanedStop}N`;

  const downtownStop =
    `${cleanedStop}S`;

  return {
    uptownStop,
    downtownStop
  };

}
async function fetchStations(direction, currentStop) {

  const query = new URLSearchParams({
    direction,
    currentStop
  });

  if (selectedRoute) {
    query.set("routeId", selectedRoute);
  }

  if (selectedBranchKey) {
    query.set("branchKey", selectedBranchKey);
  }

  const res =
    await fetch(`/stations?${query.toString()}`);

  const data =
    await res.json();

  return {
    branchKey: data.branchKey || "",
    branches: data.branches || [],
    currentStation: data.currentStation || null,
    routeId: data.routeId || selectedRoute,
    routes: data.routes || [],
    stations: data.stations || []
  };

}

function populateStationRouteButtons(id, routes) {

  const switcher =
    document.getElementById(id);

  if (!switcher) {
    return;
  }

  switcher.replaceChildren();

  routes.forEach(routeId => {
    const button =
      document.createElement("button");

    button.className =
      `station-route-button${routeId === selectedRoute ? " is-active" : ""}`;

    button.type =
      "button";

    button.dataset.routeId =
      routeId;

    button.style.setProperty("--route-color", routeColor(routeId));
    button.style.setProperty("--route-text", routeTextColor(routeId));
    button.setAttribute("aria-label", `${routeId} station list`);
    button.innerHTML = renderRouteBadgeContent(routeId);

    button.addEventListener("click", () => {
      const nextSelectId =
        routeHasBranches(routeId) ? "" : selectIdFromSwitcherId(id);

      if (routeId === selectedRoute) {
        if (nextSelectId) {
          openStationSelect(nextSelectId);
        }

        return;
      }

      rememberCurrentSelection();
      selectedRoute = routeId;
      routeWasProvided = true;
      selectedBranchKey = "";

      applySelectionToUrl();

      loadArrivals().then(() => {
        if (nextSelectId) {
          openStationSelect(nextSelectId);
        }
      });
    });

    switcher.appendChild(button);
  });

}

function populateStationBranchButtons(id, branches, activeBranchKey) {

  const switcher =
    document.getElementById(id);

  if (!switcher) {
    return;
  }

  switcher.replaceChildren();

  branches.forEach(branch => {
    const button =
      document.createElement("button");

    button.className =
      `station-branch-button${branch.key === activeBranchKey ? " is-active" : ""}`;

    button.type =
      "button";

    button.dataset.branchKey =
      branch.key;

    button.textContent =
      branchShortLabel(branch);

    button.setAttribute("aria-label", `${branch.label} branch station list`);

    button.addEventListener("click", () => {
      const nextSelectId =
        selectIdFromSwitcherId(id);

      if (branch.key === selectedBranchKey) {
        openStationSelect(nextSelectId);
        return;
      }

      rememberCurrentSelection();
      selectedBranchKey = branch.key;

      applySelectionToUrl();

      loadArrivals().then(() => openStationSelect(nextSelectId));
    });

    switcher.appendChild(button);
  });

}

function branchShortLabel(branch) {

  const labels = {
    "A-FAR ROCKAWAY": "Far Rockaway",
    "A-LEFFERTS": "Lefferts",
    "5-EASTCHESTER": "Eastchester",
    "5-NEREID": "Nereid"
  };

  return labels[branch.key] || branch.label;

}

function stationDisplayLabel(station) {

  const name =
    station?.name || "";
  const boundLabel =
    station?.boundLabel || "";

  return boundLabel ? `${name} / ${boundLabel}` : name;

}

function renderStationDisplayLabel(station) {

  const name =
    station?.name || "";
  const boundLabel =
    station?.boundLabel || "";

  if (!boundLabel) {
    return escapeHtml(name);
  }

  return `${escapeHtml(name)} <span class="station-bound-label">/ ${escapeHtml(boundLabel)}</span>`;

}

function populateStationSelect(id, stations, selectedStop, currentStation) {

  const select =
    document.getElementById(id);
  const label =
    document.getElementById(`${id}Label`);
  const shell =
    document.querySelector(`[data-select-id="${id}"]`);
  const menu =
    document.getElementById(`${id}Menu`);

  if (!select) {
    return;
  }

  select.replaceChildren();
  menu?.replaceChildren();

  stations.forEach(station => {

    const option =
      document.createElement("option");

    option.value =
      station.stopId;

    option.textContent =
      stationDisplayLabel(station);

    if (station.stopId === selectedStop) {
      option.selected = true;
    }

    select.appendChild(option);

    if (menu) {
      const item =
        document.createElement("button");

      item.type =
        "button";

      item.className =
        `station-menu-option${station.stopId === selectedStop ? " is-active" : ""}`;

      item.dataset.stopId =
        station.stopId;

      const routes =
        station.routes || [];
      const routeWrap =
        document.createElement("span");

      routeWrap.className =
        "station-menu-routes";

      routes.forEach(routeId => {
        const routeBadge =
          document.createElement("span");

        routeBadge.className =
          "station-menu-route";

        routeBadge.style.setProperty("--route-color", routeColor(routeId));
        routeBadge.style.setProperty("--route-text", routeTextColor(routeId));
        routeBadge.innerHTML =
          renderRouteBadgeContent(routeId);

        routeWrap.appendChild(routeBadge);
      });

      const stationName =
        document.createElement("span");

      stationName.className =
        "station-menu-name";

      stationName.innerHTML =
        renderStationDisplayLabel(station);

      if (routes.length) {
        item.appendChild(routeWrap);
      }

      item.appendChild(stationName);

      item.addEventListener("click", event => {
        event.stopPropagation();
        selectStationFromPicker(id, station.stopId, station.name);
      });

      menu.appendChild(item);
    }

  });

  const selectedStation =
    stations.find(station => station.stopId === selectedStop);
  const selectedOption =
    selectedStation ? select.options[select.selectedIndex] : null;
  const fallbackStation =
    currentStation ||
    selectedStation ||
    stations[0];

  if (label) {
    label.innerHTML =
      fallbackStation
        ? renderStationDisplayLabel(fallbackStation)
        : escapeHtml(selectedOption?.textContent || "");
  }

  shell?.addEventListener("click", event => {
    event.stopPropagation();
    toggleStationMenu(shell, true);
  });

  select.addEventListener("change", () => {
    const selectedOption =
      select.options[select.selectedIndex];
    const selectedStation =
      stations.find(station => station.stopId === select.value);

    selectStationFromPicker(
      id,
      select.value,
      selectedStation?.name || selectedOption?.textContent || ""
    );
  });

}

function populateSelectedStationHero(stationData) {

  const routeEl =
    document.getElementById("selectedStationHeroRoute");
  const titleEl =
    document.getElementById("selectedStationHeroTitle");

  if (!routeEl || !titleEl) {
    return;
  }

  const heroRoute =
    selectedRoute || stationData?.routeId || stationData?.routes?.[0] || "";
  const heroStation =
    stationData?.currentStation?.name || stationData?.stations?.[0]?.name || "";

  routeEl.style.setProperty("--route-color", routeColor(heroRoute));
  routeEl.style.setProperty("--route-text", routeTextColor(heroRoute));
  routeEl.innerHTML =
    renderRouteBadgeContent(heroRoute);
  routeEl.setAttribute("aria-label", `${heroRoute || "Selected"} route`);

  titleEl.textContent =
    heroStation || "Selected station";

}

function selectStationFromPicker(id, stopId, stationName) {

  const nextStopBase =
    stopId.replace(/N$|S$/, "");

  if (nextStopBase === selectedStopBase) {
    closeStationMenus();
    return;
  }

  rememberCurrentSelection();
  selectedStopBase = nextStopBase;

  const label =
    document.getElementById(`${id}Label`);

  if (label) {
    label.textContent =
      stationName;
  }

  applySelectionToUrl();

  closeStationMenus();
  loadArrivals();

}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeStationMenus();
  }
});

function setupPullToRefresh() {

  if (!resultsEl) {
    return;
  }

  resultsEl.addEventListener("touchstart", event => {
    if (currentScrollTop() > 0 || isPullRefreshing) {
      return;
    }

    pullStartY =
      event.touches[0]?.clientY || 0;
    pullDistance =
      0;
    isPullTracking =
      true;
  }, { passive: true });

  resultsEl.addEventListener("touchmove", event => {
    if (!isPullTracking || isPullRefreshing) {
      return;
    }

    const currentY =
      event.touches[0]?.clientY || 0;
    pullDistance =
      Math.max(0, currentY - pullStartY);

    if (pullDistance <= 0) {
      setPullRefreshIndicator("idle");
      return;
    }

    setPullRefreshIndicator(
      pullDistance >= PULL_REFRESH_THRESHOLD ? "ready" : "pulling"
    );
  }, { passive: true });

  resultsEl.addEventListener("touchend", async () => {
    if (!isPullTracking) {
      return;
    }

    const shouldRefresh =
      pullDistance >= PULL_REFRESH_THRESHOLD;

    isPullTracking =
      false;
    pullDistance =
      0;

    if (!shouldRefresh || isPullRefreshing) {
      setPullRefreshIndicator("idle");
      return;
    }

    isPullRefreshing =
      true;
    setPullRefreshIndicator("refreshing");

    try {
      await loadArrivals();
    } finally {
      window.setTimeout(() => {
        isPullRefreshing =
          false;
        setPullRefreshIndicator("idle");
      }, 350);
    }
  });

  resultsEl.addEventListener("touchcancel", () => {
    isPullTracking =
      false;
    pullDistance =
      0;

    if (!isPullRefreshing) {
      setPullRefreshIndicator("idle");
    }
  });

}

async function fetchDirection(platformId) {

  const query = new URLSearchParams({ stop: platformId });

  if (selectedRoute) {
    query.set("routeId", selectedRoute);
  }

  const res = await fetch(`/push-arrivals?${query.toString()}`);
  const data = await res.json();

  return data.arrivals || [];

}

async function fetchTransfers(stopId) {

  const query = new URLSearchParams({ stopId });
  const res = await fetch(`/transfers?${query.toString()}`);
  const data = await res.json();

  return data.transfers || [];

}

async function fetchServiceAlerts(direction, stopId) {

  const query =
    new URLSearchParams({
      direction,
      stopId
    });

  if (selectedRoute) {
    query.set("routeId", selectedRoute);
  }

  const res =
    await fetch(`/service-alerts?${query.toString()}`, {
      cache: "no-store"
    });
  const data =
    await res.json();

  if (!res.ok) {
    return {
      alerts: [],
      feedSample: [],
      error: data.error || "Service alerts unavailable"
    };
  }

  return {
    alerts: data.alerts || [],
    feedSample: data.feedSample || [],
    error: ""
  };

}

async function fetchRouteAlerts(routeId) {

  if (!routeId) {
    return {
      alerts: [],
      routeLinks: [],
      routes: [],
      error: ""
    };
  }

  const query =
    new URLSearchParams({
      routeId
    });
  const res =
    await fetch(`/route-alerts?${query.toString()}`, {
      cache: "no-store"
    });
  const data =
    await res.json();

  if (!res.ok) {
    return {
      alerts: [],
      routeLinks: [],
      routes: [],
      error: data.error || "Route alerts unavailable"
    };
  }

  return {
    alerts: data.alerts || [],
    alertGroups: data.alertGroups || [],
    routeLinks: data.routeLinks || [],
    routes: data.routes || [],
    error: ""
  };

}

function groupArrivals(arrivals) {

  const grouped = {};

  arrivals.forEach(arrival => {

    if (!grouped[arrival.route]) {
      grouped[arrival.route] = {
        route: arrival.route,
        station: arrival.station,
        times: []
      };
    }

    grouped[arrival.route].times.push(Number(arrival.time));

    if (!grouped[arrival.route].station && arrival.station) {
      grouped[arrival.route].station = arrival.station;
    }

  });

  return Object.values(grouped)
    .map(group => ({
      ...group,
      times: group.times
        .filter(time => Number.isFinite(time))
        .sort((a, b) => a - b)
    }))
    .filter(group => group.times.length > 0)
    .sort((a, b) => a.times[0] - b.times[0]);

}

function routeColor(route) {

  const colors = {
    "1": "#EE352E",
    "2": "#EE352E",
    "3": "#EE352E",
    "4": "#00933C",
    "5": "#00933C",
    "6": "#00933C",
    "6X": "#00933C",
    "7": "#B933AD",
    "7X": "#B933AD",
    "A": "#0039A6",
    "C": "#0039A6",
    "E": "#0039A6",
    "B": "#FF6319",
    "D": "#FF6319",
    "F": "#FF6319",
    "FX": "#FF6319",
    "M": "#FF6319",
    "G": "#6CBE45",
    "J": "#996633",
    "Z": "#996633",
    "L": "#A7A9AC",
    "N": "#FCCC0A",
    "Q": "#FCCC0A",
    "R": "#FCCC0A",
    "W": "#FCCC0A",
    "S": "#808183",
    "FS": "#808183",
    "GS": "#808183"
  };

  return colors[route] || "#475569";

}

function routeTextColor(route) {

  return ["N", "Q", "R", "W"].includes(route) ? "#111827" : "#FFFFFF";

}

function routeBadgeParts(route) {

  if (route === "GS") {
    return {
      primary: "S",
      secondary: ""
    };
  }

  if (route === "FS") {
    return {
      primary: "S",
      secondary: "F"
    };
  }

  return {
    primary: route,
    secondary: ""
  };

}

function renderRouteBadgeContent(route) {

  const {
    primary,
    secondary
  } = routeBadgeParts(route);

  return `
    <span class="route-badge-primary">${escapeHtml(primary)}</span>
    ${secondary ? `<span class="route-badge-secondary">${escapeHtml(secondary)}</span>` : ""}
  `;

}

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

}

function formatTimes(times) {

  const [first, ...nextTimes] = times;
  const next = nextTimes.slice(0, 2);

  return `
    <span class="time-cluster">
      ${new Date(Date.now() + first * 60000).toLocaleTimeString([], {
  hour: "numeric",
  minute: "2-digit"
})}
      ${next.length ? `<span class="time-secondary">• ${next.join(" • ")}</span>` : ""}
    </span>
  `;

}

function renderAlertRouteBullet(route) {

  return `
    <span
      class="alert-route-bullet"
      style="--route-color: ${routeColor(route)}; --route-text: ${routeTextColor(route)};"
      aria-label="${escapeHtml(route)} train"
    >${renderRouteBadgeContent(route)}</span>
  `;

}

function renderAlertRouteBullets(routes) {

  const uniqueRoutes =
    [...new Set((routes || []).filter(Boolean))];

  if (!uniqueRoutes.length) {
    return "";
  }

  return `
    <span class="alert-route-bullets">
      ${uniqueRoutes.map(route => renderAlertRouteBullet(route)).join("")}
    </span>
  `;

}

function renderAlertText(text) {

  const routePattern =
    /\[([A-Z0-9]+)\]/g;
  let cursor =
    0;
  let html =
    "";
  let match;

  while ((match = routePattern.exec(text || ""))) {
    html +=
      escapeHtml(text.slice(cursor, match.index));
    html +=
      renderAlertRouteBullet(match[1]);
    cursor =
      match.index + match[0].length;
  }

  html +=
    escapeHtml((text || "").slice(cursor));

  return html;

}

function formatAlertTimestamp(timestamp) {

  if (!timestamp) {
    return "";
  }

  const date =
    new Date(timestamp);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleString([], {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });

}

function renderTransferBlocks(direction, transferGroups) {

  const groups =
    transferGroups.filter(group => group.direction === direction);

  if (!groups.length) {
    return "";
  }

  return `
    <div class="transfer-blocks" aria-label="Transfer platforms">
      ${groups.map(group => {
        const routeId = group.routes[0];
        const label = `${group.routes.join(", ")} transfer platform at ${group.stationName || "this station"}`;

        return `
          <button
            class="transfer-block"
            type="button"
            data-stop-id="${escapeHtml(group.stopId)}"
            data-route-id="${escapeHtml(routeId)}"
            data-station-name="${escapeHtml(group.stationName || "")}"
            aria-label="${escapeHtml(label)}"
          >
            ${group.routes.map(transferRoute => `
              <span
                class="route-mini"
                style="--route-color:${routeColor(transferRoute)}; --route-text:${routeTextColor(transferRoute)};"
              >${renderRouteBadgeContent(transferRoute)}</span>
            `).join("")}
          </button>
        `;
      }).join("")}
    </div>
  `;

}

function renderArrival(group, title, transferBlocks) {

  const safeRoute = group.route || "?";
  const displayRoute = escapeHtml(safeRoute);
  const station = escapeHtml(group.station || `${title.toLowerCase()} platform`);

  return `
    <article class="arrival-card">
      <span
        class="route-bullet"
        style="--route-color:${routeColor(safeRoute)}; --route-text:${routeTextColor(safeRoute)};"
        aria-label="${displayRoute} train"
      >${renderRouteBadgeContent(safeRoute)}</span>
      <div class="arrival-main">
  <div class="arrival-line">
    <div class="station-line">${station}</div>

    ${formatTimes(group.times)}
  </div>
</div>
${transferBlocks}
    </article>
  `;

}

function renderAlertPanel(direction, alertData) {

  const alerts =
    alertData?.alerts || [];
  const displayAlerts =
    alerts;
  const title =
    "Matched service alerts";

  if (alertData?.error) {
    return `
      <div class="alert-panel" id="${direction}AlertPanel">
        <p class="alert-panel-title">Service alerts unavailable</p>
        <div class="alert-item-body">${escapeHtml(alertData.error)}</div>
      </div>
    `;
  }

  if (!displayAlerts.length) {
    return `
      <div class="alert-panel" id="${direction}AlertPanel">
        <p class="alert-panel-title">No active alerts found for this platform.</p>
      </div>
    `;
  }

  return `
    <div class="alert-panel" id="${direction}AlertPanel">
      <p class="alert-feed-label">${escapeHtml(title)}</p>
      ${displayAlerts.map(alert => `
        <div class="alert-item">
          <div class="alert-item-title">${renderAlertText(alert.header || "Service alert")}</div>
          <div class="alert-item-meta">
            ${escapeHtml([
              alert.timestampLabel && formatAlertTimestamp(alert.timestamp)
                ? `${alert.timestampLabel} ${formatAlertTimestamp(alert.timestamp)}`
                : "",
              alert.effect,
              alert.cause,
              alert.severity
            ].filter(Boolean).join(" • "))}
          </div>
          ${alert.description ? `<div class="alert-item-body">${renderAlertText(alert.description.slice(0, 360))}</div>` : ""}
        </div>
      `).join("")}
    </div>
  `;

}

function renderRouteAlertsFooter(routeAlertData) {

  const routeLinks =
    routeAlertData?.routeLinks || [];
  const alerts =
    routeAlertData?.alerts || [];

  if (!routeLinks.length) {
    return "";
  }

  const alertGroups =
    routeAlertData?.alertGroups?.length
      ? routeAlertData.alertGroups
      : routeLinks.map(link => ({
          routes: [link.route],
          stop: link.stop,
          route: link.route
        }));

  return `
    <section class="route-alerts-footer" aria-label="Route alerts">
      ${alerts.length ? `
        <div class="route-alerts-list">
          ${alerts.map(alert => `
            <div class="alert-item">
              <div class="alert-item-title">${renderAlertText(alert.header || "Route alert")}</div>
              <div class="alert-item-meta">
                ${escapeHtml([
                  alert.timestampLabel && formatAlertTimestamp(alert.timestamp)
                    ? `${alert.timestampLabel} ${formatAlertTimestamp(alert.timestamp)}`
                    : "",
                  alert.effect,
                  alert.cause,
                  alert.severity
                ].filter(Boolean).join(" • "))}
              </div>
              ${alert.description ? `<div class="alert-item-body">${renderAlertText(alert.description.slice(0, 260))}</div>` : ""}
            </div>
          `).join("")}
        </div>
      ` : ""}
      <div class="route-alerts-row">
        <div class="route-alerts-label">Routes with alerts:</div>
        <div class="route-alert-route-list">
          ${alertGroups.map(group => `
            <button
              class="route-alert-route-group"
              type="button"
              data-route-id="${escapeHtml(group.route || group.routes?.[0] || "")}"
              data-stop-id="${escapeHtml(group.stop || "")}"
              aria-label="${escapeHtml((group.routes || []).join(", "))} route alerts"
            >
              ${(group.routes || []).map(route => `
                <span
                  class="route-alert-route-button"
                  style="--route-color:${routeColor(route)}; --route-text:${routeTextColor(route)};"
                >${renderRouteBadgeContent(route)}</span>
              `).join("")}
            </button>
          `).join("")}
        </div>
      </div>
    </section>
  `;

}

function renderDirection(title, direction, groups, transferGroups, alertData) {

  const count = groups.reduce((total, group) => total + group.times.length, 0);
  const countLabel = count === 1 ? "1 train" : `${count} trains`;
  const transferBlocks = renderTransferBlocks(direction, transferGroups);
  const alertCount =
    alertData?.alerts?.length || 0;
  const alertLabel =
    alertData?.error ? "Alerts unavailable" : alertCount ? `${alertCount} alert${alertCount === 1 ? "" : "s"}` : "No alerts";

  return `
    <section class="direction-card" aria-label="${title} arrivals">
      <div class="direction-header">
        <h2 class="direction-title">${title}</h2>
        <span
          class="direction-alert-button${alertCount ? " has-alerts" : ""}"
          role="button"
          tabindex="0"
          data-alert-direction="${direction}"
        ><span class="direction-alert-label">${escapeHtml(alertLabel)}</span></span>
        <span class="direction-count">${groups.length ? countLabel : "No trains"}</span>
      </div>
      ${renderAlertPanel(direction, alertData)}
      ${groups.length
        ? `<div class="arrival-list">${groups.map(group => renderArrival(group, title, transferBlocks)).join("")}</div>`
        : `<div class="empty-state">No ${title.toLowerCase()} arrivals in the next hour.</div>`
      }
    </section>
  `;

}

function renderShell(uptownGroups, downtownGroups, transferGroups, alertsByDirection, routeAlertData) {

  const updatedAt = new Date().toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });

  return `
    <div class="top-bar">
      <div>
      
    
      </div>
      <div class="status-pill"><span class="live-dot"></span> ${updatedAt}</div>
    </div>
  <section class="selected-station-hero" aria-label="Selected station">
    <button
      class="station-back-button station-back-button--top${previousSelection ? "" : " is-hidden"}"
      type="button"
      id="stationBackButton"
      data-station-back-button
      aria-label="Return to previous station"
    >← Back</button>
    <span
      class="route-bullet"
      id="selectedStationHeroRoute"
      aria-hidden="true"
    ></span>
    <span class="selected-station-title" id="selectedStationHeroTitle"></span>
  </section>
  <div class="direction-stack">

  <div class="station-picker">
    <div class="station-select-wrap">
      <div class="station-route-switcher" id="uptownRouteSwitcher"></div>
      <button class="station-select-shell" type="button" data-select-id="uptownSelect" aria-haspopup="listbox" aria-label="Open uptown station list">
        <span class="station-select-label" id="uptownSelectLabel"></span>
      </button>
      <select class="station-select" id="uptownSelect" aria-label="Uptown station"></select>
      <div class="station-menu" id="uptownSelectMenu" role="listbox" aria-label="Uptown station list"></div>
    </div>
    <div class="station-branch-switcher" id="uptownBranchSwitcher"></div>
  </div>

  ${renderDirection("Uptown", "N", uptownGroups, transferGroups, alertsByDirection.N)}

  <div class="station-picker">
    <div class="station-select-wrap">
      <div class="station-route-switcher" id="downtownRouteSwitcher"></div>
      <button class="station-select-shell" type="button" data-select-id="downtownSelect" aria-haspopup="listbox" aria-label="Open downtown station list">
        <span class="station-select-label" id="downtownSelectLabel"></span>
      </button>
      <select class="station-select" id="downtownSelect" aria-label="Downtown station"></select>
      <div class="station-menu" id="downtownSelectMenu" role="listbox" aria-label="Downtown station list"></div>
    </div>
    <div class="station-branch-switcher" id="downtownBranchSwitcher"></div>
  </div>

  ${renderDirection("Downtown", "S", downtownGroups, transferGroups, alertsByDirection.S)}

  ${renderRouteAlertsFooter(routeAlertData)}

</div>
  <button
    class="station-back-button station-back-button--bottom${previousSelection ? "" : " is-hidden"}"
    type="button"
    data-station-back-button
    aria-label="Return to previous station"
  >← Back</button>
  `;

}

function attachTransferHandlers() {

  document.querySelectorAll(".transfer-block").forEach(button => {
    button.addEventListener("click", () => {
      const nextStop =
        button.dataset.stopId.replace(/N$|S$/, "");
      const nextRoute =
        button.dataset.routeId || "";

      if (sameSelection(currentSelection(), {
        branch: "",
        route: nextRoute,
        stop: nextStop
      })) {
        return;
      }

      rememberCurrentSelection();
      selectedStopBase = nextStop;
      selectedRoute = nextRoute;
      routeWasProvided = true;
      selectedBranchKey = "";

      applySelectionToUrl();

      loadArrivals();
    });
  });

}

function attachStationBackHandler() {

  document.querySelectorAll("[data-station-back-button]").forEach(button => {
    button.addEventListener("click", () => {
    const target =
      previousSelection;

    navigateToSelection(target);
  });
  });

}

function attachAlertHandlers() {

  document.querySelectorAll(".direction-alert-button").forEach(button => {
    button.addEventListener("click", () => {
      const direction =
        button.dataset.alertDirection;
      const panel =
        document.getElementById(`${direction}AlertPanel`);

      if (panel) {
        panel.classList.toggle("is-open");
      }
    });

    button.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        button.click();
      }
    });
  });

}

function attachRouteAlertHandlers() {

  document.querySelectorAll(".route-alert-route-group").forEach(button => {
    button.addEventListener("click", () => {
      const nextRoute =
        button.dataset.routeId || selectedRoute;
      const nextStop =
        button.dataset.stopId || selectedStopBase;

      if (sameSelection(currentSelection(), {
        branch: "",
        route: nextRoute,
        stop: nextStop
      })) {
        return;
      }

      rememberCurrentSelection();
      selectedRoute =
        nextRoute;
      selectedStopBase =
        nextStop;
      routeWasProvided =
        true;
      selectedBranchKey =
        "";

      applySelectionToUrl();

      loadArrivals();
    });
  });

}

async function loadArrivals(options = {}) {

  const preserveScroll =
    options.preserveScroll === true;

  if (loadInFlight) {
    queuedLoadOptions =
      preserveScroll ? { preserveScroll: true } : {};

    if (!preserveScroll) {
      loadSequence++;
    }

    return;
  }

  loadInFlight =
    true;
  const loadId =
    ++loadSequence;
  const startingSelectionKey =
    selectionKey();

  try {
    const previousScrollTop =
      preserveScroll ? currentScrollTop() : 0;
    const restoreScroll = () => {
      if (!preserveScroll) {
        return;
      }

      restoreDocumentScrollTop(previousScrollTop);
    };

    if (!selectedStopBase) {
      resultsEl.innerHTML = `
        <div class="message-card">Add a stop query parameter to show arrivals.</div>
      `;
      restoreScroll();
      return;
    }

    // Realtime refresh stabilization for Glide/iOS: keep the last good board
    // visible while the next complete payload is fetched in the background.
    const {
      uptownStop,
      downtownStop
    } = getDirectionStops(selectedStopBase);

    const [uptownArrivals, downtownArrivals, transferGroups, uptownAlerts, downtownAlerts] = await Promise.all([
      fetchDirection(uptownStop),
      fetchDirection(downtownStop),
      fetchTransfers(uptownStop),
      fetchServiceAlerts("N", uptownStop),
      fetchServiceAlerts("S", downtownStop)
    ]);

    const groupedUptown =
      groupArrivals(uptownArrivals);

    const groupedDowntown =
      groupArrivals(downtownArrivals);

    if (loadId !== loadSequence) {
      restoreScroll();
      return;
    }

    if (
      preserveScroll &&
      hasRenderedArrivals &&
      startingSelectionKey === lastSuccessfulSelectionKey &&
      !groupedUptown.length &&
      !groupedDowntown.length
    ) {
      restoreScroll();
      return;
    }

    if (!routeWasProvided && !selectedRoute) {
      selectedRoute =
        firstDisplayedRoute(groupedUptown, groupedDowntown);
    }

const [uptownStationData, downtownStationData] =
  await Promise.all([
    fetchStations("N", uptownStop),
    fetchStations("S", downtownStop)
  ]);

if (loadId !== loadSequence) {
  restoreScroll();
  return;
}

const resolvedBranchKey =
  uptownStationData.branchKey ||
  downtownStationData.branchKey;

selectedBranchKey =
  resolvedBranchKey;

const resolvedRoute =
  uptownStationData.routeId ||
  downtownStationData.routeId;
const currentParams =
  new URLSearchParams(window.location.search);

if (
  (resolvedRoute && resolvedRoute !== selectedRoute) ||
  currentParams.get("stop") !== selectedStopBase ||
  currentParams.get("branch") !== selectedBranchKey
) {
  const nextParams = new URLSearchParams(window.location.search);
  nextParams.set("stop", selectedStopBase);

  if (selectedBranchKey) {
    nextParams.set("branch", selectedBranchKey);
  } else {
    nextParams.delete("branch");
  }

  if (resolvedRoute) {
    nextParams.set("route", resolvedRoute);
  }

  window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);
}

if (resolvedRoute && resolvedRoute !== selectedRoute) {
  selectedRoute = resolvedRoute;
}

const routeAlertData =
  await fetchRouteAlerts(selectedRoute);

if (loadId !== loadSequence) {
  restoreScroll();
  return;
}

latestAlerts = {
  N: uptownAlerts,
  S: downtownAlerts
};

resultsEl.innerHTML = renderShell(groupedUptown, groupedDowntown, transferGroups, latestAlerts, routeAlertData);

populateSelectedStationHero(
  uptownStationData.currentStation ? uptownStationData : downtownStationData
);

populateStationRouteButtons(
  "uptownRouteSwitcher",
  uptownStationData.routes
);

populateStationRouteButtons(
  "downtownRouteSwitcher",
  downtownStationData.routes
);

populateStationBranchButtons(
  "uptownBranchSwitcher",
  uptownStationData.branches,
  uptownStationData.branchKey
);

populateStationBranchButtons(
  "downtownBranchSwitcher",
  downtownStationData.branches,
  downtownStationData.branchKey
);

populateStationSelect(
  "uptownSelect",
  uptownStationData.stations,
  uptownStop,
  uptownStationData.currentStation
);

populateStationSelect(
  "downtownSelect",
  downtownStationData.stations,
  downtownStop,
  downtownStationData.currentStation
);

if (openStationSelectId) {
  openStationSelect(openStationSelectId);
}

attachTransferHandlers();
attachStationBackHandler();
attachAlertHandlers();
attachRouteAlertHandlers();
hasRenderedArrivals =
  true;
lastSuccessfulSelectionKey =
  selectionKey();
restoreScroll();
  }

  catch(err) {

    if (!hasRenderedArrivals) {
      resultsEl.innerHTML = `
        <div class="message-card">Error loading arrivals. Please try again in a moment.</div>
      `;
    } else {
      console.warn("Keeping previous arrivals after refresh failed.", err);
    }

  }
  finally {
    loadInFlight =
      false;

    if (queuedLoadOptions) {
      const nextOptions =
        queuedLoadOptions;
      queuedLoadOptions =
        null;
      loadArrivals(nextOptions);
    }
  }

}

setupPullToRefresh();

loadArrivals();

setInterval(() => {
  if (!isPullTracking && !isPullRefreshing && !isStationMenuOpen()) {
    loadArrivals({ preserveScroll: true });
  }
}, 15000);
</script>
</body>
</html>
