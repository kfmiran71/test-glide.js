<!DOCTYPE html>
<html>
<head>
  <title>Commuter Eye Arrivals</title>
</head>

<body style="
  margin:0;
  background:transparent;
  font-family:Arial;
  color:white;
">



<div id="results" style="
  padding:4px;
">
Loading arrivals...
</div>

<script>
const params = new URLSearchParams(window.location.search);

const stop = params.get("stop");
const route = params.get("route");

function getDirectionStops(baseStop) {

  const cleanedStop =
    baseStop.replace(/N$|S$/, "");

  const uptownStop =
    `${cleanedStop}N`;

  const downtownStop =
    `${cleanedStop}S`;

  return {
    uptownStop,
    downtownStop
  };

}

async function fetchDirection(platformId) {

  const url = route
    ? `/push-arrivals?platformId=${platformId}&routeId=${route}`
    : `/push-arrivals?platformId=${platformId}`;

  const res = await fetch(url);
  const data = await res.json();

  return data.arrivals || [];

}

function groupArrivals(arrivals) {

  let grouped = {};

  arrivals.forEach(arrival => {

    if (!grouped[arrival.route]) {
      grouped[arrival.route] = [];
    }

    grouped[arrival.route].push(arrival.time);

  });

  return grouped;

}

function routeColor(route) {

  return route === "1" ? "#EE352E" :
         route === "2" ? "#EE352E" :
         route === "3" ? "#EE352E" :
         route === "4" ? "#00933C" :
         route === "5" ? "#00933C" :
         route === "6" ? "#00933C" :
         route === "A" ? "#0039A6" :
         route === "C" ? "#0039A6" :
         route === "E" ? "#0039A6" :
         route === "B" ? "#FF6319" :
         route === "D" ? "#FF6319" :
         "#444";

}

function renderDirection(title, grouped) {

  let html = `

    <div style="
      padding:6px 2px 12px 2px;
    ">

      <div style="
        font-size:14px;
        font-weight:700;
        color:#AAA;
        letter-spacing:1px;
        margin-bottom:10px;
        padding-left:4px;
      ">
        ${title}
      </div>

  `;

  Object.keys(grouped).forEach(route => {

    html += `

      <div style="
        background:white;
        border-radius:14px;
        padding:14px 14px;
        margin-bottom:8px;
      ">

        <div style="
          display:flex;
          align-items:center;
        ">

          <div style="
            width:44px;
            height:44px;
            border-radius:50%;
            background:${routeColor(route)};
            color:black;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            font-weight:bold;
            margin-right:14px;
            flex-shrink:0;
          ">
            ${route}
          </div>

          <div style="
            font-size:24px;
            font-weight:600;
            line-height:1.2;
            color:white;
            letter-spacing:0.5px;
          ">
            ${grouped[route].join(" • ")} min
          </div>

        </div>

      </div>

    `;

  });

  html += `</div>`;

  return html;

}

async function loadArrivals() {

  try {

    const {
      uptownStop,
      downtownStop
    } = getDirectionStops(stop);

    const uptownArrivals =
      await fetchDirection(uptownStop);

    const downtownArrivals =
      await fetchDirection(downtownStop);

    const groupedUptown =
      groupArrivals(uptownArrivals);

    const groupedDowntown =
      groupArrivals(downtownArrivals);

    let html = "";

    html += renderDirection(
      "UPTOWN",
      groupedUptown
    );

    html += renderDirection(
      "DOWNTOWN",
      groupedDowntown
    );

    document.getElementById("results").innerHTML = html;

  }

  catch(err) {

    document.getElementById("results").innerHTML =
      "Error loading arrivals";

  }

}

loadArrivals();

setInterval(loadArrivals, 15000);
</script>
</body>
</html>
