<!DOCTYPE html>
<html>
<head>
  <title>Commuter Eye Arrivals</title>
</head>

<body>

<h1>Commuter Eye Arrivals</h1>

<div id="results">
Loading arrivals...
</div>

<script>
const params = new URLSearchParams(window.location.search);

const stop = params.get("stop");
const route = params.get("route");

fetch(`/push-arrivals?platformId=${stop}&routeId=${route}`)
  .then(res => res.json())
  .then(data => {

  let html = "";

  data.arrivals.forEach(arrival => {

    html += `
      <div style="
        padding:16px;
        margin-bottom:12px;
        border:1px solid #ccc;
        border-radius:12px;
        font-family:Arial;
      ">

        <div style="
          font-size:32px;
          font-weight:bold;
          margin-bottom:8px;
        ">
          ${arrival.route}
        </div>

        <div style="
          font-size:22px;
          margin-bottom:4px;
        ">
          ${arrival.time} min
        </div>

        <div>
          ${arrival.station}
        </div>

        <div>
          ${arrival.direction}
        </div>

      </div>
    `;

  });

  document.getElementById("results").innerHTML = html;

})
  .catch(err => {
    document.getElementById("results").innerHTML =
      "Error loading arrivals";
  });
</script>

</body>
</html>
