<!DOCTYPE html>
<html>
<head>
  <title>Commuter Eye Arrivals</title>
</head>

<body>

<h1>Commuter Eye Arrivals</h1>

<div id="results">
Loading arrivals...
</div>

<script>
const params = new URLSearchParams(window.location.search);

const stop = params.get("stop");
const route = params.get("route");

fetch(`/push-arrivals?platformId=${stop}&routeId=${route}`)
  .then(res => res.json())
  .then(data => {

 let grouped = {};

data.arrivals.forEach(arrival => {

  if (!grouped[arrival.route]) {
    grouped[arrival.route] = [];
  }

  grouped[arrival.route].push(arrival.time);

});

let html = "";

Object.keys(grouped).forEach(route => {

  html += `
    <div style="
      padding:16px;
      margin-bottom:12px;
      border:1px solid #ccc;
      border-radius:12px;
      font-family:Arial;
    ">

     <div style="
  width:56px;
  height:56px;
  border-radius:50%;
  background:${route === "2" ? "#EE352E" :
              route === "3" ? "#EE352E" :
              route === "4" ? "#00933C" :
              route === "5" ? "#00933C" :
              route === "6" ? "#00933C" :
              "#444"};

  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:12px;
">
  ${route}
</div>

      <div style="
        font-size:24px;
      ">
        ${grouped[route].join(" • ")} min
      </div>

    </div>
  `;

});

document.getElementById("results").innerHTML = html;
})
  .catch(err => {
    document.getElementById("results").innerHTML =
      "Error loading arrivals";
  });
</script>

</body>
</html>
