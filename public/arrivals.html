<!DOCTYPE html>
<html>
<head>
  <title>Commuter Eye Arrivals</title>
</head>

<body style="
  margin:0;
  background:#111;
  font-family:Arial;
  color:white;
">

<div style="
  padding:20px;
  font-size:34px;
  font-weight:bold;
  border-bottom:1px solid #333;
">
  Arrivals
</div>

<div id="results" style="
  padding:16px;
">
Loading arrivals...
</div>

<script>
const params = new URLSearchParams(window.location.search);

const stop = params.get("stop");
const route = params.get("route");

fetch(`/push-arrivals?platformId=${stop}&routeId=${route}`)
  .then(res => res.json())
  .then(data => {

 let grouped = {};

data.arrivals.forEach(arrival => {

  if (!grouped[arrival.route]) {
    grouped[arrival.route] = [];
  }

  grouped[arrival.route].push(arrival.time);

});


})
  .catch(err => {
    document.getElementById("results").innerHTML =
      "Error loading arrivals";
  });
</script>

</body>
</html>
