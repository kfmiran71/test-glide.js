<!DOCTYPE html>
<html>
<head>
  <title>Commuter Eye Arrivals</title>
</head>

<body style="
  margin:0;
  background:#111;
  font-family:Arial;
  color:white;
">

<div style="
  padding:20px;
  font-size:34px;
  font-weight:bold;
  border-bottom:1px solid #333;
">
  Arrivals
</div>

<div id="results" style="
  padding:16px;
">
Loading arrivals...
</div>

<script>
const params = new URLSearchParams(window.location.search);

const stop = params.get("stop");
const route = params.get("route");

fetch(`/push-arrivals?platformId=${stop}&routeId=${route}`)
  .then(res => res.json())
  .then(data => {

 let grouped = {};

data.arrivals.forEach(arrival => {

  if (!grouped[arrival.route]) {
    grouped[arrival.route] = [];
  }

  grouped[arrival.route].push(arrival.time);

});

let html = "";

Object.keys(grouped).forEach(route => {

  html += `
    <div style="
      padding:14px 16px;
margin-bottom:8px;
background:#1A1A1D;
border-radius:16px;
font-family:Arial;
display:flex;
align-items:center;
justify-content:space-between;
    ">

     <div style="
 width:42px;
height:42px;
  border-radius:50%;
  background:${route === "2" ? "#EE352E" :
              route === "3" ? "#EE352E" :
              route === "4" ? "#00933C" :
              route === "5" ? "#00933C" :
              route === "6" ? "#00933C" :
              "#444"};

  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:bold;
  margin-right:16px;
flex-shrink:0;
">
  ${route}
</div>

      <div style="
        font-size:22px;
font-weight:600;
letter-spacing:0.5px;
      ">
        ${grouped[route].join(" • ")} min
      </div>

    </div>
  `;

});

document.getElementById("results").innerHTML = html;
})
  .catch(err => {
    document.getElementById("results").innerHTML =
      "Error loading arrivals";
  });
</script>

</body>
</html>
