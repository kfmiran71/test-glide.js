  <main class="embed-shell" aria-label="Realtime subway arrivals">
    <section id="results" class="arrivals-panel" aria-live="polite">

        <div class="status-pill"><span class="live-dot"></span> Loading</div>
      </div>

      <div class="direction-stack">
        <div class="direction-card">
          <div class="direction-header">
            <h2 class="direction-title">Uptown</h2>
            <span class="direction-count">Updating</span>
          </div>
          <div class="arrival-list">
            <div class="arrival-card skeleton"><span class="route-bullet"></span><div class="arrival-main"><div class="arrival-line"><span class="route-label">Train</span><span class="time-cluster">--<span class="time-unit">min</span></span></div><div class="station-line">Checking the platform</div></div></div>
          </div>
        </div>

        <div class="direction-card">
          <div class="direction-header">
            <h2 class="direction-title">Downtown</h2>
            <span class="direction-count">Updating</span>
          </div>
          <div class="arrival-list">
            <div class="arrival-card skeleton"><span class="route-bullet"></span><div class="arrival-main"><div class="arrival-line"><span class="route-label">Train</span><span class="time-cluster">--<span class="time-unit">min</span></span></div><div class="station-line">Checking the platform</div></div></div>
          </div>
        </div>
      </div>
    </section>

<script>
const params = new URLSearchParams(window.location.search);

function firstParam(names) {

  for (const name of names) {
    const value = params.get(name);

    if (value) {
      return value.trim();
    }
  }

  return "";

}

const stop = firstParam(["stop", "stopId", "platformId", "stationId"]);
const route = firstParam(["route", "routeId", "line", "train"]);
const resultsEl = document.getElementById("results");
let selectedStopBase = stop ? stop.replace(/N$|S$/, "") : "";
let selectedRoute = route || "";
let routeWasProvided = Boolean(route);
let selectedBranchKey = firstParam(["branch", "branchKey"]) || "";
let latestAlerts = {
  N: { alerts: [], feedSample: [], error: "" },
  S: { alerts: [], feedSample: [], error: "" }
};

function routeHasBranches(routeId) {

  return routeId === "5" || routeId === "A";

}

function firstDisplayedRoute(uptownGroups, downtownGroups) {

  return uptownGroups[0]?.route || downtownGroups[0]?.route || "";

}

function selectIdFromSwitcherId(id) {

  return id
    .replace("RouteSwitcher", "Select")
    .replace("BranchSwitcher", "Select");

}

function openStationSelect(id) {

  const shell =
    document.querySelector(`[data-select-id="${id}"]`);

  if (!shell) {
    return;
  }

  toggleStationMenu(shell, true);

}

function closeStationMenus(exceptShell = null) {

  document.querySelectorAll(".station-select-wrap.is-open").forEach(wrap => {
    if (!exceptShell || !wrap.contains(exceptShell)) {
      wrap.classList.remove("is-open");
    }
  });

}

function toggleStationMenu(shell, forceOpen = null) {

  const wrap =
    shell.closest(".station-select-wrap");

  if (!wrap) {
    return;
  }

  const shouldOpen =
    forceOpen === null ? !wrap.classList.contains("is-open") : forceOpen;

  closeStationMenus(shell);
  wrap.classList.toggle("is-open", shouldOpen);

}

function getDirectionStops(baseStop) {

  const cleanedStop =
    baseStop.replace(/N$|S$/, "");

  const uptownStop =
    `${cleanedStop}N`;

  const downtownStop =
    `${cleanedStop}S`;

  return {
    uptownStop,
    downtownStop
  };

}
async function fetchStations(direction, currentStop) {

  const query = new URLSearchParams({
    direction,
    currentStop
  });

  if (selectedRoute) {
    query.set("routeId", selectedRoute);
  }

  if (selectedBranchKey) {
    query.set("branchKey", selectedBranchKey);
  }

  const res =
    await fetch(`/stations?${query.toString()}`);

  const data =
    await res.json();

  return {
    branchKey: data.branchKey || "",
    branches: data.branches || [],
    currentStation: data.currentStation || null,
    routeId: data.routeId || selectedRoute,
    routes: data.routes || [],
    stations: data.stations || []
  };

}

function populateStationRouteButtons(id, routes) {

  const switcher =
    document.getElementById(id);

  if (!switcher) {
    return;
  }

  switcher.replaceChildren();

  routes.forEach(routeId => {
    const button =
      document.createElement("button");

    button.className =
      `station-route-button${routeId === selectedRoute ? " is-active" : ""}`;

    button.type =
      "button";

    button.dataset.routeId =
      routeId;

    button.style.setProperty("--route-color", routeColor(routeId));
    button.style.setProperty("--route-text", routeTextColor(routeId));
    button.setAttribute("aria-label", `${routeId} station list`);
    button.innerHTML = renderRouteBadgeContent(routeId);

    button.addEventListener("click", () => {
      selectedRoute = routeId;
      routeWasProvided = true;
      selectedBranchKey = "";
      const nextSelectId =
        routeHasBranches(routeId) ? "" : selectIdFromSwitcherId(id);

      const nextParams = new URLSearchParams(window.location.search);
      nextParams.set("route", selectedRoute);
      nextParams.delete("branch");
      window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);

      loadArrivals().then(() => {
        if (nextSelectId) {
          openStationSelect(nextSelectId);
        }
      });
    });

    switcher.appendChild(button);
  });

}

function populateStationBranchButtons(id, branches, activeBranchKey) {

  const switcher =
    document.getElementById(id);

  if (!switcher) {
    return;
  }

  switcher.replaceChildren();

  branches.forEach(branch => {
    const button =
      document.createElement("button");

    button.className =
      `station-branch-button${branch.key === activeBranchKey ? " is-active" : ""}`;

    button.type =
      "button";

    button.dataset.branchKey =
      branch.key;

    button.textContent =
      branchShortLabel(branch);

    button.setAttribute("aria-label", `${branch.label} branch station list`);

    button.addEventListener("click", () => {
      selectedBranchKey = branch.key;
      const nextSelectId =
        selectIdFromSwitcherId(id);

      const nextParams = new URLSearchParams(window.location.search);
      nextParams.set("branch", selectedBranchKey);
      window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);

      loadArrivals().then(() => openStationSelect(nextSelectId));
    });

    switcher.appendChild(button);
  });

}

function branchShortLabel(branch) {

  const labels = {
    "A-FAR ROCKAWAY": "Far Rockaway",
    "A-LEFFERTS": "Lefferts",
    "5-EASTCHESTER": "Eastchester",
    "5-NEREID": "Nereid"
  };

  return labels[branch.key] || branch.label;

}

function populateStationSelect(id, stations, selectedStop, currentStation) {

  const select =
    document.getElementById(id);
  const label =
    document.getElementById(`${id}Label`);
  const shell =
    document.querySelector(`[data-select-id="${id}"]`);
  const menu =
    document.getElementById(`${id}Menu`);

  if (!select) {
    return;
  }

  select.replaceChildren();
  menu?.replaceChildren();

  stations.forEach(station => {

    const option =
      document.createElement("option");

    option.value =
      station.stopId;

    option.textContent =
      station.name;

    if (station.stopId === selectedStop) {
      option.selected = true;
    }

    select.appendChild(option);

    if (menu) {
      const item =
        document.createElement("button");

      item.type =
        "button";

      item.className =
        `station-menu-option${station.stopId === selectedStop ? " is-active" : ""}`;

      item.dataset.stopId =
        station.stopId;

      const routes =
        station.routes || [];
      const routeWrap =
        document.createElement("span");

      routeWrap.className =
        "station-menu-routes";

      routes.forEach(routeId => {
        const routeBadge =
          document.createElement("span");

        routeBadge.className =
          "station-menu-route";

        routeBadge.style.setProperty("--route-color", routeColor(routeId));
        routeBadge.style.setProperty("--route-text", routeTextColor(routeId));
        routeBadge.innerHTML =
          renderRouteBadgeContent(routeId);

        routeWrap.appendChild(routeBadge);
      });

      const stationName =
        document.createElement("span");

      stationName.className =
        "station-menu-name";

      stationName.textContent =
        station.name;

      if (routes.length) {
        item.appendChild(routeWrap);
      }

      item.appendChild(stationName);

      item.addEventListener("click", () => {
        selectStationFromPicker(id, station.stopId, station.name);
      });

      menu.appendChild(item);
    }

  });

  const selectedStation =
    stations.find(station => station.stopId === selectedStop);
  const selectedOption =
    selectedStation ? select.options[select.selectedIndex] : null;
  const fallbackName =
    currentStation?.name || selectedStation?.name || stations[0]?.name || "";

  if (label) {
    label.textContent =
      selectedOption?.textContent || fallbackName;
  }

  shell?.addEventListener("click", () => {
    toggleStationMenu(shell);
  });

  select.addEventListener("change", () => {
    const selectedOption =
      select.options[select.selectedIndex];

    selectStationFromPicker(id, select.value, selectedOption?.textContent || "");
  });

}

function selectStationFromPicker(id, stopId, stationName) {

  selectedStopBase = stopId.replace(/N$|S$/, "");

  const label =
    document.getElementById(`${id}Label`);

  if (label) {
    label.textContent =
      stationName;
  }

  const nextParams = new URLSearchParams(window.location.search);
  nextParams.set("stop", selectedStopBase);
  window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);

  closeStationMenus();
  loadArrivals();

}

document.addEventListener("click", event => {
  if (!event.target.closest(".station-select-wrap")) {
    closeStationMenus();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeStationMenus();
  }
});
async function fetchDirection(platformId) {

  const query = new URLSearchParams({ stop: platformId });

  if (selectedRoute) {
    query.set("routeId", selectedRoute);
  }

  const res = await fetch(`/push-arrivals?${query.toString()}`);
  const data = await res.json();

  return data.arrivals || [];

}

async function fetchTransfers(stopId) {

  const query = new URLSearchParams({ stopId });
  const res = await fetch(`/transfers?${query.toString()}`);
  const data = await res.json();

  return data.transfers || [];

}

async function fetchServiceAlerts(direction, stopId) {

  const query =
    new URLSearchParams({
      direction,
      stopId
    });

  if (selectedRoute) {
    query.set("routeId", selectedRoute);
  }

  const res =
    await fetch(`/service-alerts?${query.toString()}`);
  const data =
    await res.json();

  if (!res.ok) {
    return {
      alerts: [],
      feedSample: [],
      error: data.error || "Service alerts unavailable"
    };
  }

  return {
    alerts: data.alerts || [],
    feedSample: data.feedSample || [],
    error: ""
  };

}

function groupArrivals(arrivals) {

  const grouped = {};

  arrivals.forEach(arrival => {

    if (!grouped[arrival.route]) {
      grouped[arrival.route] = {
        route: arrival.route,
        station: arrival.station,
        times: []
      };
    }

    grouped[arrival.route].times.push(Number(arrival.time));

    if (!grouped[arrival.route].station && arrival.station) {
      grouped[arrival.route].station = arrival.station;
    }

  });

  return Object.values(grouped)
    .map(group => ({
      ...group,
      times: group.times
        .filter(time => Number.isFinite(time))
        .sort((a, b) => a - b)
    }))
    .filter(group => group.times.length > 0)
    .sort((a, b) => a.times[0] - b.times[0]);

}

function routeColor(route) {

  const colors = {
    "1": "#EE352E",
    "2": "#EE352E",
    "3": "#EE352E",
    "4": "#00933C",
    "5": "#00933C",
    "6": "#00933C",
    "6X": "#00933C",
    "7": "#B933AD",
    "7X": "#B933AD",
    "A": "#0039A6",
    "C": "#0039A6",
    "E": "#0039A6",
    "B": "#FF6319",
    "D": "#FF6319",
    "F": "#FF6319",
    "FX": "#FF6319",
    "M": "#FF6319",
    "G": "#6CBE45",
    "J": "#996633",
    "Z": "#996633",
    "L": "#A7A9AC",
    "N": "#FCCC0A",
    "Q": "#FCCC0A",
    "R": "#FCCC0A",
    "W": "#FCCC0A",
    "S": "#808183",
    "FS": "#808183",
    "GS": "#808183"
  };

  return colors[route] || "#475569";

}

function routeTextColor(route) {

  return ["N", "Q", "R", "W"].includes(route) ? "#111827" : "#FFFFFF";

}

function routeBadgeParts(route) {

  if (route === "GS") {
    return {
      primary: "S",
      secondary: ""
    };
  }

  if (route === "FS") {
    return {
      primary: "S",
      secondary: "F"
    };
  }

  return {
    primary: route,
    secondary: ""
  };

}

function renderRouteBadgeContent(route) {

  const {
    primary,
    secondary
  } = routeBadgeParts(route);

  return `
    <span class="route-badge-primary">${escapeHtml(primary)}</span>
    ${secondary ? `<span class="route-badge-secondary">${escapeHtml(secondary)}</span>` : ""}
  `;

}

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

}

function formatTimes(times) {

  const [first, ...nextTimes] = times;
  const next = nextTimes.slice(0, 2);

  return `
    <span class="time-cluster">
      ${new Date(Date.now() + first * 60000).toLocaleTimeString([], {
  hour: "numeric",
  minute: "2-digit"
})}
      ${next.length ? `<span class="time-secondary">• ${next.join(" • ")}</span>` : ""}
    </span>
  `;

}

function renderTransferBlocks(direction, transferGroups) {

  const groups =
    transferGroups.filter(group => group.direction === direction);

  if (!groups.length) {
    return "";
  }

  return `
    <div class="transfer-blocks" aria-label="Transfer platforms">
      ${groups.map(group => {
        const routeId = group.routes[0];
        const label = `${group.routes.join(", ")} transfer platform at ${group.stationName || "this station"}`;

        return `
          <button
            class="transfer-block"
            type="button"
            data-stop-id="${escapeHtml(group.stopId)}"
            data-route-id="${escapeHtml(routeId)}"
            data-station-name="${escapeHtml(group.stationName || "")}"
            aria-label="${escapeHtml(label)}"
          >
            ${group.routes.map(transferRoute => `
              <span
                class="route-mini"
                style="--route-color:${routeColor(transferRoute)}; --route-text:${routeTextColor(transferRoute)};"
              >${renderRouteBadgeContent(transferRoute)}</span>
            `).join("")}
          </button>
        `;
      }).join("")}
    </div>
  `;

}

function renderArrival(group, title, transferBlocks) {

  const safeRoute = group.route || "?";
  const displayRoute = escapeHtml(safeRoute);
  const station = escapeHtml(group.station || `${title.toLowerCase()} platform`);

  return `
    <article class="arrival-card">
      <span
        class="route-bullet"
        style="--route-color:${routeColor(safeRoute)}; --route-text:${routeTextColor(safeRoute)};"
        aria-label="${displayRoute} train"
      >${renderRouteBadgeContent(safeRoute)}</span>
      <div class="arrival-main">
  <div class="arrival-line">
    <div class="station-line">${station}</div>

    ${formatTimes(group.times)}
  </div>
</div>
${transferBlocks}
    </article>
  `;

}

function renderAlertPanel(direction, alertData) {

  const alerts =
    alertData?.alerts || [];
  const feedSample =
    alertData?.feedSample || [];
  const displayAlerts =
    alerts.length ? alerts : feedSample.slice(0, 5);
  const title =
    alerts.length ? "Matched service alerts" : "MTA alert feed sample";

  if (alertData?.error) {
    return `
      <div class="alert-panel" id="${direction}AlertPanel">
        <p class="alert-panel-title">Service alerts unavailable</p>
        <div class="alert-item-body">${escapeHtml(alertData.error)}</div>
      </div>
    `;
  }

  if (!displayAlerts.length) {
    return `
      <div class="alert-panel" id="${direction}AlertPanel">
        <p class="alert-panel-title">No active alerts found for this platform.</p>
      </div>
    `;
  }

  return `
    <div class="alert-panel" id="${direction}AlertPanel">
      <p class="alert-feed-label">${escapeHtml(title)}</p>
      ${displayAlerts.map(alert => `
        <div class="alert-item">
          <div class="alert-item-title">${escapeHtml(alert.header || "Service alert")}</div>
          <div class="alert-item-meta">
            ${escapeHtml([alert.effect, alert.cause, alert.severity, alert.routes?.join(" ")].filter(Boolean).join(" • "))}
          </div>
          ${alert.description ? `<div class="alert-item-body">${escapeHtml(alert.description).slice(0, 360)}</div>` : ""}
        </div>
      `).join("")}
    </div>
  `;

}

function renderDirection(title, direction, groups, transferGroups, alertData) {

  const count = groups.reduce((total, group) => total + group.times.length, 0);
  const countLabel = count === 1 ? "1 train" : `${count} trains`;
  const transferBlocks = renderTransferBlocks(direction, transferGroups);
  const alertCount =
    alertData?.alerts?.length || 0;
  const alertLabel =
    alertData?.error ? "Alerts unavailable" : alertCount ? `${alertCount} alert${alertCount === 1 ? "" : "s"}` : "No alerts";

  return `
    <section class="direction-card" aria-label="${title} arrivals">
      <div class="direction-header">
        <h2 class="direction-title">${title}</h2>
        <button
          class="direction-alert-button${alertCount ? " has-alerts" : ""}"
          type="button"
          data-alert-direction="${direction}"
        >${escapeHtml(alertLabel)}</button>
        <span class="direction-count">${groups.length ? countLabel : "No trains"}</span>
      </div>
      ${renderAlertPanel(direction, alertData)}
      ${groups.length
        ? `<div class="arrival-list">${groups.map(group => renderArrival(group, title, transferBlocks)).join("")}</div>`
        : `<div class="empty-state">No ${title.toLowerCase()} arrivals in the next hour.</div>`
      }
    </section>
  `;

}

function renderShell(uptownGroups, downtownGroups, transferGroups, alertsByDirection) {

  const updatedAt = new Date().toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });

  return `
    <div class="top-bar">
      <div>
      
    
      </div>
      <div class="status-pill"><span class="live-dot"></span> ${updatedAt}</div>
    </div>
  <div class="direction-stack">

  <div class="station-picker">
    <div class="station-select-wrap">
      <div class="station-route-switcher" id="uptownRouteSwitcher"></div>
      <button class="station-select-shell" type="button" data-select-id="uptownSelect" aria-haspopup="listbox" aria-label="Open uptown station list">
        <span class="station-select-label" id="uptownSelectLabel"></span>
      </button>
      <select class="station-select" id="uptownSelect" aria-label="Uptown station"></select>
      <div class="station-menu" id="uptownSelectMenu" role="listbox" aria-label="Uptown station list"></div>
    </div>
    <div class="station-branch-switcher" id="uptownBranchSwitcher"></div>
  </div>

  ${renderDirection("Uptown", "N", uptownGroups, transferGroups, alertsByDirection.N)}

  <div class="station-picker">
    <div class="station-select-wrap">
      <div class="station-route-switcher" id="downtownRouteSwitcher"></div>
      <button class="station-select-shell" type="button" data-select-id="downtownSelect" aria-haspopup="listbox" aria-label="Open downtown station list">
        <span class="station-select-label" id="downtownSelectLabel"></span>
      </button>
      <select class="station-select" id="downtownSelect" aria-label="Downtown station"></select>
      <div class="station-menu" id="downtownSelectMenu" role="listbox" aria-label="Downtown station list"></div>
    </div>
    <div class="station-branch-switcher" id="downtownBranchSwitcher"></div>
  </div>

  ${renderDirection("Downtown", "S", downtownGroups, transferGroups, alertsByDirection.S)}

</div>
  `;

}

function attachTransferHandlers() {

  document.querySelectorAll(".transfer-block").forEach(button => {
    button.addEventListener("click", () => {
      selectedStopBase = button.dataset.stopId.replace(/N$|S$/, "");
      selectedRoute = button.dataset.routeId;
      routeWasProvided = true;
      selectedBranchKey = "";

      const nextParams = new URLSearchParams(window.location.search);
      nextParams.set("stop", selectedStopBase);
      nextParams.set("route", selectedRoute);
      nextParams.delete("branch");
      window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);

      loadArrivals();
    });
  });

}

function attachAlertHandlers() {

  document.querySelectorAll(".direction-alert-button").forEach(button => {
    button.addEventListener("click", () => {
      const direction =
        button.dataset.alertDirection;
      const panel =
        document.getElementById(`${direction}AlertPanel`);

      if (panel) {
        panel.classList.toggle("is-open");
      }
    });
  });

}

async function loadArrivals() {

  try {

    if (!selectedStopBase) {
      resultsEl.innerHTML = `
        <div class="message-card">Add a stop query parameter to show arrivals.</div>
      `;
      return;
    }

    const {
      uptownStop,
      downtownStop
    } = getDirectionStops(selectedStopBase);

    const [uptownArrivals, downtownArrivals, transferGroups, uptownAlerts, downtownAlerts] = await Promise.all([
      fetchDirection(uptownStop),
      fetchDirection(downtownStop),
      fetchTransfers(uptownStop),
      fetchServiceAlerts("N", uptownStop),
      fetchServiceAlerts("S", downtownStop)
    ]);

    latestAlerts = {
      N: uptownAlerts,
      S: downtownAlerts
    };

    const groupedUptown =
      groupArrivals(uptownArrivals);

    const groupedDowntown =
      groupArrivals(downtownArrivals);

    if (!routeWasProvided && !selectedRoute) {
      selectedRoute =
        firstDisplayedRoute(groupedUptown, groupedDowntown);
    }

    resultsEl.innerHTML = renderShell(groupedUptown, groupedDowntown, transferGroups, latestAlerts);
const uptownStationData =
  await fetchStations("N", uptownStop);

const downtownStationData =
  await fetchStations("S", downtownStop);

const resolvedBranchKey =
  uptownStationData.branchKey ||
  downtownStationData.branchKey;

selectedBranchKey =
  resolvedBranchKey;

const resolvedRoute =
  uptownStationData.routeId ||
  downtownStationData.routeId;
const currentParams =
  new URLSearchParams(window.location.search);

if (
  (resolvedRoute && resolvedRoute !== selectedRoute) ||
  currentParams.get("stop") !== selectedStopBase ||
  currentParams.get("branch") !== selectedBranchKey
) {
  const nextParams = new URLSearchParams(window.location.search);
  nextParams.set("stop", selectedStopBase);

  if (selectedBranchKey) {
    nextParams.set("branch", selectedBranchKey);
  } else {
    nextParams.delete("branch");
  }

  if (resolvedRoute) {
    nextParams.set("route", resolvedRoute);
  }

  window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);
}

if (resolvedRoute && resolvedRoute !== selectedRoute) {
  selectedRoute = resolvedRoute;
}

populateStationRouteButtons(
  "uptownRouteSwitcher",
  uptownStationData.routes
);

populateStationRouteButtons(
  "downtownRouteSwitcher",
  downtownStationData.routes
);

populateStationBranchButtons(
  "uptownBranchSwitcher",
  uptownStationData.branches,
  uptownStationData.branchKey
);

populateStationBranchButtons(
  "downtownBranchSwitcher",
  downtownStationData.branches,
  downtownStationData.branchKey
);

populateStationSelect(
  "uptownSelect",
  uptownStationData.stations,
  uptownStop,
  uptownStationData.currentStation
);

populateStationSelect(
  "downtownSelect",
  downtownStationData.stations,
  downtownStop,
  downtownStationData.currentStation
);

attachTransferHandlers();
attachAlertHandlers();
  }

  catch(err) {

    resultsEl.innerHTML = `
      <div class="message-card">Error loading arrivals. Please try again in a moment.</div>
    `;

  }

}

loadArrivals();

setInterval(loadArrivals, 15000);
</script>
