<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Commuter Eye Arrivals</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #09090b;
      --muted: #5b6c8b;
     --soft: #dbeafe;
      --card: rgba(255, 255, 255, 0.96);
      --hairline: rgba(15, 23, 42, 0.08);

    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #1D3461;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Arial, sans-serif;
      color: var(--ink);

      text-rendering: geometricPrecision;
    }

    .embed-shell {
      height: 100vh;
      min-height: 260px;
      padding: 0px;
      background:
       radial-gradient(circle at 12% -10%, rgba(0, 147, 60, 0.13), transparent 34%),
       radial-gradient(circle at 96% 0%, rgba(0, 57, 166, 0.12), transparent 32%), 
     #1D3461;
      border-radius: 24px;
      overflow: hidden;
    }

    .arrivals-panel {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(15, 23, 42, 0.22) transparent;
    }

    .arrivals-panel::-webkit-scrollbar {
      width: 4px;
    }

    .arrivals-panel::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, 0.22);
      border-radius: 999px;
    }

    .top-bar {
      display: flex;
      align-items: center;

      gap: 10px;
      margin-bottom: 10px;
      padding: 2px 4px;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .title {
      margin: 0;
      color: var(--ink);
      font-size: 22px;
      font-weight: 820;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .status-pill {
  display: none;
}
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.72);
      color: #374151;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.14);
    }

    .direction-stack {
      display: grid;
      gap: 42px;.station-select-wrap {
  padding: 0 8px;
}

.station-select {
  width: 100%;
  height: 40px;

  border: 1px solid rgba(15,23,42,0.08);
  border-radius: 10px;

 background: rgba(255,255,255,0.96);
  color: #111827;

  font-size: 15px;
  font-weight: 600;

  padding: 0 14px;

  outline: none;
  appearance: none;
  -webkit-appearance: none;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.station-select option {
  color: black;
}
    }

    .direction-card {
      border: 1px solid var(--hairline);
      border-radius: var(--radius-xl);
      background: #FFFFFF;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .direction-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px 9px;
    }

    .direction-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #111827;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .direction-arrow {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #111827;
      color: white;
      font-size: 13px;
      line-height: 1;
    }

    .direction-count {
  display: none;
}
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .arrival-list {
      display: grid;
      gap: 7px;
      padding: 0 8px 8px;
    }

   .arrival-card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 16px;
  min-height: 82px;
  border: 1px solid rgba(15, 23, 42, 0.055);
  border-radius: 10px;
  padding: 12px 18px;
  background: var(--card);
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

    .route-bullet {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: var(--route-color, #6b7280);
      color: var(--route-text, #fff);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.03em;
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.18);
    }

    .arrival-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}


    .arrival-line {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  width: 100%;
  gap: 8px;
}
      
    
      
    
      
      


    .route-label {
      display: none;
      overflow: hidden;
      color: #4b5563;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

  .time-cluster {
  color: #111827;
  font-size: 10px;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
  white-space: nowrap;
  margin-left: auto;

  display: flex;
  align-items: baseline;

  padding-top: -6px;
  gap: 10px;
}
      
transform: translateY(-6px);      
      
      
      
      
    

    .time-unit {
      margin-left: 3px;
      color: #111827;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

   .time-secondary {
  color: #374151;
  font-size: 15px;

  letter-spacing: -0.02em;

  display: inline-flex;

  gap: 6px;
}
    .station-line {
  color: #111827;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.03em;
  line-height: 1.1;
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
}
    .empty-state,
    .message-card {
      margin: 0 8px 8px;
      border: 1px dashed rgba(15, 23, 42, 0.14);
      border-radius: var(--radius-lg);
      padding: 14px;
      background: rgba(255, 255, 255, 0.70);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
    }

    .skeleton::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.72), transparent);
      transform: translateX(-100%);
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer {
      to {
        transform: translateX(100%);
      }
    }

    @media (max-width: 360px) {
      .embed-shell {
        padding: 8px;
      }

      .title {
        font-size: 20px;
      }

      .status-pill {
        padding: 6px 8px;
        font-size: 10px;
      }

      .time-cluster {
        font-size: 22px;
      }
    }

</head>
<body>
  <main class="embed-shell" aria-label="Realtime subway arrivals">
    <section id="results" class="arrivals-panel" aria-live="polite">
      <div class="top-bar">
        <div>
          
          
        </div>
        <div class="status-pill"><span class="live-dot"></span> Loading</div>
      </div>

      <div class="direction-stack">
        <div class="direction-card">
          <div class="direction-header">
            <h2 class="direction-title">Uptown</h2>
            <span class="direction-count">Updating</span>
          </div>
          <div class="arrival-list">
            <div class="arrival-card skeleton"><span class="route-bullet"></span><div class="arrival-main"><div class="arrival-line"><span class="route-label">Train</span><span class="time-cluster">--<span class="time-unit">min</span></span></div><div class="station-line">Checking the platform</div></div></div>
          </div>
        </div>

        <div class="direction-card">
          <div class="direction-header">
            <h2 class="direction-title">Downtown</h2>
            <span class="direction-count">Updating</span>
          </div>
          <div class="arrival-list">
            <div class="arrival-card skeleton"><span class="route-bullet"></span><div class="arrival-main"><div class="arrival-line"><span class="route-label">Train</span><span class="time-cluster">--<span class="time-unit">min</span></span></div><div class="station-line">Checking the platform</div></div></div>
          </div>
        </div>
      </div>
    </section>
  </main>

<script>
const params = new URLSearchParams(window.location.search);

const stop = params.get("stop");
const route = params.get("route");
const resultsEl = document.getElementById("results");

function getDirectionStops(baseStop) {

  const cleanedStop =
    baseStop.replace(/N$|S$/, "");

  const uptownStop =
    `${cleanedStop}N`;

  const downtownStop =
    `${cleanedStop}S`;

  return {
    uptownStop,
    downtownStop
  };

}
async function fetchStations(direction) {

  const query = new URLSearchParams({
    direction
  });

  if (route) {
    query.set("routeId", route);
  }

  const res =
    await fetch(`/stations?${query.toString()}`);

  const data =
    await res.json();

  return data.stations || [];

}

function populateStationSelect(id, stations, selectedStop) {

  const select =
    document.getElementById(id);

  if (!select) {
    return;
  }

  select.replaceChildren();

  stations.forEach(station => {

    const option =
      document.createElement("option");

    option.value =
      station.stopId;

    option.textContent =
      station.name;

    if (station.stopId === selectedStop) {
      option.selected = true;
    }

    select.appendChild(option);

  });

}
async function fetchDirection(platformId) {

  const query = new URLSearchParams({ platformId });

  if (route) {
    query.set("routeId", route);
  }

  const res = await fetch(`/push-arrivals?${query.toString()}`);
  const data = await res.json();

  return data.arrivals || [];

}

function groupArrivals(arrivals) {

  const grouped = {};

  arrivals.forEach(arrival => {

    if (!grouped[arrival.route]) {
      grouped[arrival.route] = {
        route: arrival.route,
        station: arrival.station,
        times: []
      };
    }

    grouped[arrival.route].times.push(Number(arrival.time));

    if (!grouped[arrival.route].station && arrival.station) {
      grouped[arrival.route].station = arrival.station;
    }

  });

  return Object.values(grouped)
    .map(group => ({
      ...group,
      times: group.times
        .filter(time => Number.isFinite(time))
        .sort((a, b) => a - b)
    }))
    .filter(group => group.times.length > 0)
    .sort((a, b) => a.times[0] - b.times[0]);

}

function routeColor(route) {

  const colors = {
    "1": "#EE352E",
    "2": "#EE352E",
    "3": "#EE352E",
    "4": "#00933C",
    "5": "#00933C",
    "6": "#00933C",
    "7": "#B933AD",
    "A": "#0039A6",
    "C": "#0039A6",
    "E": "#0039A6",
    "B": "#FF6319",
    "D": "#FF6319",
    "F": "#FF6319",
    "M": "#FF6319",
    "G": "#6CBE45",
    "J": "#996633",
    "Z": "#996633",
    "L": "#A7A9AC",
    "N": "#FCCC0A",
    "Q": "#FCCC0A",
    "R": "#FCCC0A",
    "W": "#FCCC0A",
    "S": "#808183"
  };

  return colors[route] || "#475569";

}

function routeTextColor(route) {

  return ["N", "Q", "R", "W"].includes(route) ? "#111827" : "#FFFFFF";

}

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

}

function formatTimes(times) {

  const [first, ...nextTimes] = times;
  const next = nextTimes.slice(0, 2);

  return `
    <span class="time-cluster">
      ${new Date(Date.now() + first * 60000).toLocaleTimeString([], {
  hour: "numeric",
  minute: "2-digit"
})}
      ${next.length ? `<span class="time-secondary">• ${next.join(" • ")}</span>` : ""}
    </span>
  `;

}

function renderArrival(group, title) {

  const safeRoute = group.route || "?";
  const displayRoute = escapeHtml(safeRoute);
  const station = escapeHtml(group.station || `${title.toLowerCase()} platform`);

  return `
    <article class="arrival-card">
      <span
        class="route-bullet"
        style="--route-color:${routeColor(safeRoute)}; --route-text:${routeTextColor(safeRoute)};"
        aria-label="${displayRoute} train"
      >${displayRoute}</span>
      <div class="arrival-main">
  <div class="arrival-line">
    <div class="station-line">${station}</div>

    ${formatTimes(group.times)}
  </div>
</div>
    </article>
  `;

}

function renderDirection(title, arrow, groups) {

  const count = groups.reduce((total, group) => total + group.times.length, 0);
  const countLabel = count === 1 ? "1 train" : `${count} trains`;

  return `
    <section class="direction-card" aria-label="${title} arrivals">
      <div class="direction-header">
        <h2 class="direction-title">${title}</h2>
        <span class="direction-count">${groups.length ? countLabel : "No trains"}</span>
      </div>
      ${groups.length
        ? `<div class="arrival-list">${groups.map(group => renderArrival(group, title)).join("")}</div>`
        : `<div class="empty-state">No ${title.toLowerCase()} arrivals in the next hour.</div>`
      }
    </section>
  `;

}

function renderShell(uptownGroups, downtownGroups) {

  const updatedAt = new Date().toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });

  return `
    <div class="top-bar">
      <div>
      
    
      </div>
      <div class="status-pill"><span class="live-dot"></span> ${updatedAt}</div>
    </div>
  <div class="direction-stack">

  <div class="station-select-wrap">
    <select class="station-select" id="uptownSelect"></select>
  </div>

  ${renderDirection("Uptown", "↑", uptownGroups)}

  <div class="station-select-wrap">
    <select class="station-select" id="downtownSelect"></select>
  </div>

  ${renderDirection("Downtown", "↓", downtownGroups)}

</div>
  `;

}

async function loadArrivals() {

  try {

    if (!stop) {
      resultsEl.innerHTML = `
        <div class="message-card">Add a stop query parameter to show arrivals.</div>
      `;
      return;
    }

    const {
      uptownStop,
      downtownStop
    } = getDirectionStops(stop);

    const [uptownArrivals, downtownArrivals] = await Promise.all([
      fetchDirection(uptownStop),
      fetchDirection(downtownStop)
    ]);

    const groupedUptown =
      groupArrivals(uptownArrivals);

    const groupedDowntown =
      groupArrivals(downtownArrivals);

    resultsEl.innerHTML = renderShell(groupedUptown, groupedDowntown);
const uptownStations =
  await fetchStations("N");

const downtownStations =
  await fetchStations("S");

populateStationSelect(
  "uptownSelect",
  uptownStations,
  uptownStop
);

populateStationSelect(
  "downtownSelect",
  downtownStations,
  downtownStop
);
  }

  catch(err) {

    resultsEl.innerHTML = `
      <div class="message-card">Error loading arrivals. Please try again in a moment.</div>
    `;

  }

}

loadArrivals();

setInterval(loadArrivals, 15000);
</script>
</body>
</html>
