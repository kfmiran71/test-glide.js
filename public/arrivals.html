<!DOCTYPE html>
<html>
<head>
  <title>Commuter Eye Arrivals</title>
</head>

<body>

<h1>Commuter Eye Arrivals</h1>

<div id="results">
Loading arrivals...
</div>

<script>
const params = new URLSearchParams(window.location.search);

const stop = params.get("stop");
const route = params.get("route");

fetch(`/push-arrivals?platformId=${stop}&routeId=${route}`)
  .then(res => res.json())
  .then(data => {

 let grouped = {};

data.arrivals.forEach(arrival => {

  if (!grouped[arrival.route]) {
    grouped[arrival.route] = [];
  }

  grouped[arrival.route].push(arrival.time);

});

let html = "";

Object.keys(grouped).forEach(route => {

  html += `
    <div style="
      padding:16px;
      margin-bottom:12px;
      border:1px solid #ccc;
      border-radius:12px;
      font-family:Arial;
    ">

      <div style="
        font-size:36px;
        font-weight:bold;
        margin-bottom:8px;
      ">
        ${route}
      </div>

      <div style="
        font-size:24px;
      ">
        ${grouped[route].join(" • ")} min
      </div>

    </div>
  `;

});

document.getElementById("results").innerHTML = html;
})
  .catch(err => {
    document.getElementById("results").innerHTML =
      "Error loading arrivals";
  });
</script>

</body>
</html>
