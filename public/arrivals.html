<body>

    <section id="results" class="arrivals-panel" aria-live="polite">
      <div class="top-bar">
        <div>
          
          
        </div>

      </div>

          </div>
        </div>
      </div>
    </section>
  </main>

<script>
const params = new URLSearchParams(window.location.search);

function isDepartureProofLockEnabled(searchParams) {

  return searchParams.get("departureProofLock") !== "0";

}

const departureProofLockEnabled =
  isDepartureProofLockEnabled(params);
const departureProofStates =
  departureProofLockEnabled ? new Map() : null;
const departureProofModulePromise =
  departureProofLockEnabled
    ? import("./departure-proof-lock.js")
    : null;

function isArrivalProofGateEnabled(searchParams) {

  return searchParams.get("arrivalProofGate") !== "0";

}

const arrivalProofGateEnabled =
  isArrivalProofGateEnabled(params);
const arrivalProofStates =
  arrivalProofGateEnabled ? new Map() : null;
const arrivalProofModulePromise =
  arrivalProofGateEnabled
    ? import("./arrival-proof-gate.js")
    : null;

function isPlatformAlertSuppressionEnabled(searchParams) {

  return searchParams.get("platformAlertSuppression") !== "0";

}

const platformAlertSuppressionEnabled =
  isPlatformAlertSuppressionEnabled(params);
const platformAvailabilityStates =
  platformAlertSuppressionEnabled ? new Map() : null;
const platformAlertModulePromise =
  platformAlertSuppressionEnabled
    ? import("./platform-alert-suppression.js")
    : null;

function isVehicleProofQuarantineEnabled(searchParams) {

  return searchParams.get("vehicleProofQuarantine") !== "0";

}

const vehicleProofQuarantineEnabled =
  isVehicleProofQuarantineEnabled(params);
const vehicleProofQuarantineStates =
  vehicleProofQuarantineEnabled ? new Map() : null;
const vehicleProofQuarantineModulePromise =
  vehicleProofQuarantineEnabled
    ? import("./vehicle-proof-quarantine.js")
    : null;

function firstParam(names) {

  for (const name of names) {
    const value = params.get(name);

    if (value) {
      return value.trim();
    }
  }

  return "";

}

const stop = firstParam(["stop", "stopId", "platformId", "stationId"]);
const route = firstParam(["route", "routeId", "line", "train"]);
const resultsEl = document.getElementById("results");
let selectedStopBase = stop ? stop.replace(/N$|S$/, "") : "";
let selectedRoute = route || "";
let routeWasProvided = Boolean(route);
let selectedBranchKey = firstParam(["branch", "branchKey"]) || "";
let previousSelection = null;
let latestAlerts = {
  N: { alerts: [], feedSample: [], error: "" },
  S: { alerts: [], feedSample: [], error: "" }
};
let loadInFlight = false;
let queuedLoadOptions = null;
let loadSequence = 0;
let hasRenderedArrivals = false;
let lastSuccessfulSelectionKey = "";
let openStationSelectId = "";
const openAlertDirections = new Set();
let activeTouchCount = 0;
let lastTouchScrollAt = 0;
const touchScrollQuietMs = 900;

function markTouchScrollActive() {

  lastTouchScrollAt =
    Date.now();

}

function isTouchScrollActive() {

  return activeTouchCount > 0 || Date.now() - lastTouchScrollAt < touchScrollQuietMs;

}

function selectionKey() {

  return [
    selectedStopBase || "",
    selectedRoute || "",
    selectedBranchKey || ""
  ].join("|");

}

function currentSelection() {

  return {
    branch: selectedBranchKey || "",
    route: selectedRoute || "",
    stop: selectedStopBase || ""
  };

}

function sameSelection(a, b) {

  return Boolean(a && b) &&
    a.branch === b.branch &&
    a.route === b.route &&
    a.stop === b.stop;

}

function rememberCurrentSelection() {

  const snapshot =
    currentSelection();

  if (!snapshot.stop) {
    return;
  }

  if (!sameSelection(snapshot, previousSelection)) {
    previousSelection =
      snapshot;
  }

}

function applySelectionToUrl() {

  const nextParams =
    new URLSearchParams(window.location.search);

  if (selectedStopBase) {
    nextParams.set("stop", selectedStopBase);
  }

  if (selectedRoute) {
    nextParams.set("route", selectedRoute);
  } else {
    nextParams.delete("route");
  }

  if (selectedBranchKey) {
    nextParams.set("branch", selectedBranchKey);
  } else {
    nextParams.delete("branch");
  }

  window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);

}

function navigateToSelection(selection) {

  if (!selection?.stop) {
    return;
  }

  previousSelection =
    null;
  selectedStopBase =
    selection.stop;
  selectedRoute =
    selection.route || "";
  routeWasProvided =
    Boolean(selectedRoute);
  selectedBranchKey =
    selection.branch || "";

  applySelectionToUrl();
  loadArrivals();

}

function currentScrollTop() {

  return window.scrollY ||
    document.documentElement.scrollTop ||
    document.body.scrollTop ||
    0;

}

function maxDocumentScrollTop() {

  const scrollHeight =
    Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    );
  const viewportHeight =
    window.innerHeight || document.documentElement.clientHeight || 0;

  return Math.max(0, scrollHeight - viewportHeight);

}

function restoreDocumentScrollTop(scrollTop) {

  if (isTouchScrollActive()) {
    return;
  }

  window.requestAnimationFrame(() => {
    if (!isTouchScrollActive()) {
      window.scrollTo(0, Math.min(scrollTop, maxDocumentScrollTop()));
    }
  });

}

function routeHasBranches(routeId) {

  return routeId === "5" || routeId === "A";

}

function firstDisplayedRoute(uptownGroups, downtownGroups) {

  return uptownGroups[0]?.route || downtownGroups[0]?.route || "";

}

function selectIdFromSwitcherId(id) {

  return id
    .replace("RouteSwitcher", "Select")
    .replace("BranchSwitcher", "Select");

}

function openStationSelect(id) {

  const shell =
    document.querySelector(`[data-select-id="${id}"]`);

  if (!shell) {
    return;
  }

  toggleStationMenu(shell, true);

}

function closeStationMenus(exceptShell = null) {

  document.querySelectorAll(".station-select-wrap.is-open").forEach(wrap => {
    if (!exceptShell || !wrap.contains(exceptShell)) {
      wrap.classList.remove("is-open");
    }
  });

  if (!exceptShell) {
    openStationSelectId =
      "";
  }

}

function toggleStationMenu(shell, forceOpen = null) {

  const wrap =
    shell.closest(".station-select-wrap");

  if (!wrap) {
    return;
  }

  const shouldOpen =
    forceOpen === null ? !wrap.classList.contains("is-open") : forceOpen;

  closeStationMenus(shell);
  wrap.classList.toggle("is-open", shouldOpen);
  openStationSelectId =
    shouldOpen ? shell.dataset.selectId || "" : "";

}

function isStationMenuOpen() {

  return Boolean(openStationSelectId);

}

function getDirectionStops(baseStop) {

  const cleanedStop =
    baseStop.replace(/N$|S$/, "");

  const uptownStop =
    `${cleanedStop}N`;

  const downtownStop =
    `${cleanedStop}S`;

  return {
    uptownStop,
    downtownStop
  };

}
async function fetchStations(direction, currentStop) {

  const query = new URLSearchParams({
    direction,
    currentStop
  });

  if (selectedRoute) {
    query.set("routeId", selectedRoute);
  }

  if (selectedBranchKey) {
    query.set("branchKey", selectedBranchKey);
  }

  const res =
    await fetch(`/stations?${query.toString()}`);

  const data =
    await res.json();

  return {
    branchKey: data.branchKey || "",
    branches: data.branches || [],
    currentStation: data.currentStation || null,
    routeId: data.routeId || selectedRoute,
    routes: data.routes || [],
    stations: data.stations || []
  };

}

function populateStationRouteButtons(id, routes) {

  const switcher =
    document.getElementById(id);

  if (!switcher) {
    return;
  }

  switcher.replaceChildren();

  routes.forEach(routeId => {
    const button =
      document.createElement("button");

    button.className =
      `station-route-button${routeId === selectedRoute ? " is-active" : ""}`;

    button.type =
      "button";

    button.dataset.routeId =
      routeId;

    button.style.setProperty("--route-color", routeColor(routeId));
    button.style.setProperty("--route-text", routeTextColor(routeId));
    button.setAttribute("aria-label", `${routeId} station list`);
    button.innerHTML = renderRouteBadgeContent(routeId, { compact: true });

    button.addEventListener("click", () => {
      const nextSelectId =
        routeHasBranches(routeId) ? "" : selectIdFromSwitcherId(id);

      if (routeId === selectedRoute) {
        if (nextSelectId) {
          openStationSelect(nextSelectId);
        }

        return;
      }

      rememberCurrentSelection();
      selectedRoute = routeId;
      routeWasProvided = true;
      selectedBranchKey = "";

      applySelectionToUrl();

      loadArrivals().then(() => {
        if (nextSelectId) {
          openStationSelect(nextSelectId);
        }
      });
    });

    switcher.appendChild(button);
  });

}

function populateStationBranchButtons(id, branches, activeBranchKey) {

  const switcher =
    document.getElementById(id);

  if (!switcher) {
    return;
  }

  switcher.replaceChildren();

  branches.forEach(branch => {
    const button =
      document.createElement("button");

    button.className =
      `station-branch-button${branch.key === activeBranchKey ? " is-active" : ""}`;

    button.type =
      "button";

    button.dataset.branchKey =
      branch.key;

    button.textContent =
      branchShortLabel(branch);

    button.setAttribute("aria-label", `${branch.label} branch station list`);

    button.addEventListener("click", () => {
      const nextSelectId =
        selectIdFromSwitcherId(id);

      if (branch.key === selectedBranchKey) {
        openStationSelect(nextSelectId);
        return;
      }

      rememberCurrentSelection();
      selectedBranchKey = branch.key;

      applySelectionToUrl();

      loadArrivals().then(() => openStationSelect(nextSelectId));
    });

    switcher.appendChild(button);
  });

}

function branchShortLabel(branch) {

  const labels = {
    "A-FAR ROCKAWAY": "Far Rockaway",
    "A-LEFFERTS": "Lefferts",
    "5-EASTCHESTER": "Eastchester",
    "5-NEREID": "Nereid"
  };

  return labels[branch.key] || branch.label;

}

function stationDisplayLabel(station) {

  const name =
    station?.name || "";
  const boundLabel =
    station?.boundLabel || "";

  return boundLabel ? `${name} / ${boundLabel}` : name;

}

function renderStationDisplayLabel(station) {

  const name =
    station?.name || "";
  const boundLabel =
    station?.boundLabel || "";

  if (!boundLabel) {
    return escapeHtml(name);
  }

  return `${escapeHtml(name)} <span class="station-bound-label">/ ${escapeHtml(boundLabel)}</span>`;

}

function populateStationSelect(id, stations, selectedStop, currentStation) {

  const select =
    document.getElementById(id);
  const label =
    document.getElementById(`${id}Label`);
  const shell =
    document.querySelector(`[data-select-id="${id}"]`);
  const menu =
    document.getElementById(`${id}Menu`);

  if (!select) {
    return;
  }

  select.replaceChildren();
  menu?.replaceChildren();

  stations.forEach(station => {

    const option =
      document.createElement("option");

    option.value =
      station.stopId;

    option.textContent =
      stationDisplayLabel(station);

    if (station.stopId === selectedStop) {
      option.selected = true;
    }

    select.appendChild(option);

    if (menu) {
      const item =
        document.createElement("button");

      item.type =
        "button";

      item.className =
        `station-menu-option${station.stopId === selectedStop ? " is-active" : ""}`;

      item.dataset.stopId =
        station.stopId;

      const routes =
        station.routes || [];
      const routeWrap =
        document.createElement("span");

      routeWrap.className =
        "station-menu-routes";

      routes.forEach(routeId => {
        const routeBadge =
          document.createElement("span");

        routeBadge.className =
          "station-menu-route";

        routeBadge.style.setProperty("--route-color", routeColor(routeId));
        routeBadge.style.setProperty("--route-text", routeTextColor(routeId));
        routeBadge.innerHTML =
          renderRouteBadgeContent(routeId, { compact: true });

        routeWrap.appendChild(routeBadge);
      });

      const stationName =
        document.createElement("span");

      stationName.className =
        "station-menu-name";

      stationName.innerHTML =
        renderStationDisplayLabel(station);

      if (routes.length) {
        item.appendChild(routeWrap);
      }

      item.appendChild(stationName);

      item.addEventListener("click", event => {
        event.stopPropagation();
        selectStationFromPicker(id, station.stopId, station.name);
      });

      menu.appendChild(item);
    }

  });

  if (menu) {
    const closeButton =
      document.createElement("button");

    closeButton.type =
      "button";

    closeButton.className =
      "station-menu-close";

    closeButton.textContent =
      "Close station list";

    closeButton.addEventListener("click", event => {
      event.stopPropagation();
      closeStationMenus();
    });

    menu.appendChild(closeButton);
  }

  const selectedStation =
    stations.find(station => station.stopId === selectedStop);
  const selectedOption =
    selectedStation ? select.options[select.selectedIndex] : null;
  const fallbackStation =
    currentStation ||
    selectedStation ||
    stations[0];

  if (label) {
    label.innerHTML =
      fallbackStation
        ? renderStationDisplayLabel(fallbackStation)
        : escapeHtml(selectedOption?.textContent || "");
  }

  shell?.addEventListener("click", event => {
    event.stopPropagation();
    toggleStationMenu(shell, true);
  });

  select.addEventListener("change", () => {
    const selectedOption =
      select.options[select.selectedIndex];
    const selectedStation =
      stations.find(station => station.stopId === select.value);

    selectStationFromPicker(
      id,
      select.value,
      selectedStation?.name || selectedOption?.textContent || ""
    );
  });

}

function populateSelectedStationHero(stationData) {

  const routeEl =
    document.getElementById("selectedStationHeroRoute");
  const titleEl =
    document.getElementById("selectedStationHeroTitle");

  if (!routeEl || !titleEl) {
    return;
  }

  const heroRoute =
    selectedRoute || stationData?.routeId || stationData?.routes?.[0] || "";
  const heroStation =
    stationData?.currentStation?.name || stationData?.stations?.[0]?.name || "";

  routeEl.style.setProperty("--route-color", routeColor(heroRoute));
  routeEl.style.setProperty("--route-text", routeTextColor(heroRoute));
  routeEl.innerHTML =
    renderRouteBadgeContent(heroRoute);
  routeEl.setAttribute("aria-label", `${heroRoute || "Selected"} route`);

  titleEl.textContent =
    heroStation || "Selected station";

}

function selectStationFromPicker(id, stopId, stationName) {

  const nextStopBase =
    stopId.replace(/N$|S$/, "");

  if (nextStopBase === selectedStopBase) {
    closeStationMenus();
    return;
  }

  rememberCurrentSelection();
  selectedStopBase = nextStopBase;

  const label =
    document.getElementById(`${id}Label`);

  if (label) {
    label.textContent =
      stationName;
  }

  applySelectionToUrl();

  closeStationMenus();
  loadArrivals();

}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeStationMenus();
  }
});

async function fetchDirection(platformId) {

  const query = new URLSearchParams({ stop: platformId });

  if (selectedRoute) {
    query.set("routeId", selectedRoute);
  }

  if (departureProofLockEnabled) {
    query.set("departureProofLock", "1");
  }
  if (arrivalProofGateEnabled) {
    query.set("arrivalProofGate", "1");
  }
  if (vehicleProofQuarantineEnabled) {
    query.set("vehicleProofQuarantine", "1");
  }

  const res = await fetch(`/push-arrivals?${query.toString()}`);
  const data = await res.json();

  if (departureProofLockEnabled || arrivalProofGateEnabled) {
    return {
      arrivals: data.arrivals || [],
      evidence:
        data.arrivalProofGate?.evidence ||
        data.departureProofLock?.evidence ||
        []
    };
  }

  return data.arrivals || [];

}

async function arrivalProofArrivals(
  platformId,
  snapshot,
  availabilityState
) {

  const {
    arrivalProofBoardArrivals,
    initialArrivalProofGateState,
    reconcileArrivalProofGates,
    suppressArrivalProofGates
  } = await arrivalProofModulePromise;
  const {
    filterPlatformUnavailableArrivals
  } = platformAlertSuppressionEnabled
    ? await platformAlertModulePromise
    : { filterPlatformUnavailableArrivals: (_state, arrivals) => arrivals };
  let currentState =
    arrivalProofStates.get(platformId) ||
    initialArrivalProofGateState();

  if (availabilityState?.activeEvidence?.length) {
    currentState =
      suppressArrivalProofGates(
        currentState,
        availabilityState.activeEvidence,
        Date.now()
      );
  }

  const filteredArrivals =
    filterPlatformUnavailableArrivals(
      availabilityState,
      snapshot.arrivals
    );
  const nextState =
    reconcileArrivalProofGates(
      currentState,
      { ...snapshot, arrivals: filteredArrivals },
      Date.now()
    );

  arrivalProofStates.set(platformId, nextState);
  return {
    ...snapshot,
    arrivals: filterPlatformUnavailableArrivals(
      availabilityState,
      arrivalProofBoardArrivals(nextState, filteredArrivals)
    )
  };

}

async function vehicleProofArrivals(platformId, snapshot, availabilityState) {

  const {
    initialVehicleProofQuarantineState,
    reconcileVehicleProofQuarantine,
    vehicleProofCandidateArrivals
  } = await vehicleProofQuarantineModulePromise;
  const {
    filterPlatformUnavailableArrivals
  } = platformAlertSuppressionEnabled
    ? await platformAlertModulePromise
    : { filterPlatformUnavailableArrivals: (_state, arrivals) => arrivals };
  const currentState =
    vehicleProofQuarantineStates.get(platformId) ||
    initialVehicleProofQuarantineState();
  const filteredArrivals =
    filterPlatformUnavailableArrivals(
      availabilityState,
      snapshot.arrivals
    );
  const nextState =
    reconcileVehicleProofQuarantine(
      currentState,
      { ...snapshot, arrivals: filteredArrivals },
      Date.now()
    );

  vehicleProofQuarantineStates.set(platformId, nextState);
  return {
    ...snapshot,
    arrivals: vehicleProofCandidateArrivals(nextState)
  };

}

async function platformAvailabilityState(platformId, alertPayload) {

  if (!platformAlertSuppressionEnabled) {
    return null;
  }

  const {
    initialAuthoritativePlatformAvailability,
    reconcilePlatformAvailability
  } = await platformAlertModulePromise;
  const previous =
    platformAvailabilityStates.get(platformId) ||
    initialAuthoritativePlatformAvailability(
      platformId,
      Date.now()
    );
  const next =
    reconcilePlatformAvailability(
      previous,
      alertPayload.platformAvailability,
      Date.now()
    );

  platformAvailabilityStates.set(platformId, next);
  return next;

}

async function departureProofArrivals(
  platformId,
  snapshot,
  availabilityState
) {

  const {
    experimentalBoardArrivals,
    reconcileDepartureProofLocks,
    suppressDepartureProofLocks
  } = await departureProofModulePromise;
  const {
    filterPlatformUnavailableArrivals
  } = platformAlertSuppressionEnabled
    ? await platformAlertModulePromise
    : { filterPlatformUnavailableArrivals: (_state, arrivals) => arrivals };
  let currentState =
    departureProofStates.get(platformId) ||
    {
      active: {},
      released: [],
      tombstones: {},
      suppressed: [],
      suppressionTombstones: {}
    };

  if (availabilityState?.activeEvidence?.length) {
    currentState =
      suppressDepartureProofLocks(
        currentState,
        availabilityState.activeEvidence,
        Date.now()
      );
  }

  const filteredArrivals =
    filterPlatformUnavailableArrivals(
      availabilityState,
      snapshot.arrivals
    );
  const nextState =
    reconcileDepartureProofLocks(
      currentState,
      {
        ...snapshot,
        arrivals: filteredArrivals
      },
      Date.now()
    );

  departureProofStates.set(platformId, nextState);
  return filterPlatformUnavailableArrivals(
    availabilityState,
    experimentalBoardArrivals(nextState, filteredArrivals)
  );

}

if (departureProofLockEnabled) {
  departureProofModulePromise.then(({ createDepartureProofDiagnostics }) => {
    Object.defineProperty(window, "__departureProofLock", {
      configurable: false,

async function fetchTransfers(stopId) {

  const query = new URLSearchParams({ stopId });
  const res = await fetch(`/transfers?${query.toString()}`);
  const data = await res.json();

  return data.transfers || [];

}

async function fetchServiceAlerts(direction, stopId) {

  try {
    const query =
      new URLSearchParams({
        direction,
        stopId
      });

    if (selectedRoute) {
      query.set("routeId", selectedRoute);
    }

    const res =
      await fetch(`/service-alerts?${query.toString()}`, {
        cache: "no-store"
      });
    const data =
      await res.json();

    if (!res.ok) {
      return {
        alerts: [],
        feedSample: [],
        error: data.error || "Service alerts unavailable",
        platformAvailability:
          data.platformAvailability || {
            feedSucceeded: false,
            evidence: [],
            error: data.error || "Service alerts unavailable"
          }
      };
    }

    return {
      alerts: data.alerts || [],
      feedSample: data.feedSample || [],
      error: "",
      platformAvailability:
        data.platformAvailability || {
          feedSucceeded: true,
          evidence: []
        }
    };
  } catch (error) {
    return {
      alerts: [],
      feedSample: [],
      error: error.message || "Service alerts unavailable",
      platformAvailability: {
        feedSucceeded: false,
        evidence: [],
        error: error.message || "Service alerts unavailable"
      }
    };
  }

}

async function fetchRouteAlerts(routeId) {

      lookAheadAlerts: [],
      routeLinks: [],
      routes: [],
      error: ""
    };

    });

    });

function groupArrivals(arrivals) {

  const grouped = {};

  arrivals.forEach(arrival => {

    if (!grouped[arrival.route]) {
      grouped[arrival.route] = {
        route: arrival.route,
        lat: arrival.lat,
        lon: arrival.lon,
        platformId: arrival.platformId,
        station: arrival.station,
        times: []
      };
    }

    grouped[arrival.route].times.push(Number(arrival.time));

    if (!grouped[arrival.route].station && arrival.station) {
      grouped[arrival.route].station = arrival.station;
    }

    if (!grouped[arrival.route].lat && arrival.lat) {
      grouped[arrival.route].lat = arrival.lat;
    }

    if (!grouped[arrival.route].lon && arrival.lon) {
      grouped[arrival.route].lon = arrival.lon;
    }

    if (!grouped[arrival.route].platformId && arrival.platformId) {
      grouped[arrival.route].platformId = arrival.platformId;
    }

  });

  return Object.values(grouped)
    .map(group => ({
      ...group,
      times: group.times
        .filter(time => Number.isFinite(time))
        .sort((a, b) => a - b)
    }))
    .filter(group => group.times.length > 0)
    .sort((a, b) => a.times[0] - b.times[0]);

}

function routeColor(route) {

    "5": "#00933C",

    "7": "#B933AD",
    "7X": "#B933AD",
    "A": "#0039A6",
    "C": "#0039A6",
    "E": "#0039A6",
    "B": "#FF6319",
    "D": "#FF6319",
    "F": "#FF6319",
    "FX": "#FF6319",
    "M": "#FF6319",
    "G": "#6CBE45",
    "J": "#996633",
    "Z": "#996633",
    "L": "#A7A9AC",
    "N": "#FCCC0A",
    "Q": "#FCCC0A",

    "GS": "#808183",

  };

  return colors[route] || "#475569";

}

function routeTextColor(route) {

  return ["N", "Q", "R", "W"].includes(route) ? "#111827" : "#FFFFFF";

}

function routeBadgeParts(route, options = {}) {

  const compact =
    options.compact === true;
  const shuttleSecondary = {
    FS: "F",
    H: "R",
    SF: "F",
    SR: "R"
  };

  if (route === "S" || route === "GS" || shuttleSecondary[route]) {
    return {
      primary: "S",
      secondary: compact ? "" : shuttleSecondary[route] || ""
    };
  }

  return {
    primary: route,
    secondary: ""
  };

}

function renderRouteBadgeContent(route, options = {}) {

  const {
    primary,
    secondary
  } = routeBadgeParts(route, options);

  return `
    <span class="route-badge-primary">${escapeHtml(primary)}</span>
    ${secondary ? `<span class="route-badge-secondary">${escapeHtml(secondary)}</span>` : ""}
  `;

}

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

}

function formatTimes(times) {

  const [first, ...nextTimes] = times;
  const next = nextTimes.slice(0, 2);
  const firstMinutes =
    Number(first);
  const isApproaching =
    Number.isFinite(firstMinutes) && firstMinutes <= 1;
  const primaryTime =
    Number.isFinite(firstMinutes)
      ? String(Math.max(0, Math.round(firstMinutes)))
      : String(first ?? "--");

  return `
    <span class="time-cluster">
      <span class="time-primary${isApproaching ? " is-approaching" : ""}" aria-label="${isApproaching ? "Approaching train" : "Next train"}">${primaryTime}</span>
      ${next.length ? `<span class="time-secondary">• ${next.join(" • ")}</span>` : ""}
    </span>
  `;

}

function renderAlertRouteBullet(route) {

  return `
    <span
      class="alert-route-bullet"
      style="--route-color: ${routeColor(route)}; --route-text: ${routeTextColor(route)};"
      aria-label="${escapeHtml(route)} train"
    >${renderRouteBadgeContent(route, { compact: true })}</span>
  `;

}

function renderAlertRouteBullets(routes) {

  const uniqueRoutes =
    [...new Set((routes || []).filter(Boolean))];

  if (!uniqueRoutes.length) {
    return "";
  }

  return `
    <span class="alert-route-bullets">
      ${uniqueRoutes.map(route => renderAlertRouteBullet(route)).join("")}
    </span>
  `;

}

function alertKey(alert) {

  return alert?.id || [
    alert?.header || "",
    alert?.description || "",
    alert?.timestamp || ""
  ].join("|");

}

function alertAppliesToRoute(alert, routeId) {

  if (!routeId) {
    return true;
  }

  const routes =
    alert?.routes || [];

  if (routes.includes(routeId)) {
    return true;
  }

  const safeRouteId =
    String(routeId).replace(/[^A-Za-z0-9]/g, "");
  const routePattern =
    new RegExp("\\[" + safeRouteId + "\\]");

  return routePattern.test(alert?.header || "") ||
    routePattern.test(alert?.description || "");

}

function mergeAlerts(...alertLists) {

  const seen =
    new Set();
  const merged =
    [];

  alertLists.flat().filter(Boolean).forEach(alert => {
    const key =
      alertKey(alert);

    if (!key || seen.has(key)) {
      return;
    }

    seen.add(key);
    merged.push(alert);
  });

  return merged;

}

function routeAlertsWithPlatformFallback(routeAlertData, platformAlertData, routeId) {

  const platformAlerts =
    platformAlertData
      .flatMap(data => data?.alerts || [])
      .filter(alert => alertAppliesToRoute(alert, routeId));

  return {
    ...(routeAlertData || {}),
    alerts: mergeAlerts(routeAlertData?.alerts || [], platformAlerts).slice(0, 4)
  };

}

function renderAlertText(text) {

  const routePattern =
    /\[([A-Z0-9]+)\]/g;
  let cursor =
    0;
  let html =
    "";
  let match;

  while ((match = routePattern.exec(text || ""))) {
    html +=
      escapeHtml(text.slice(cursor, match.index));
    html +=
      renderAlertRouteBullet(match[1]);
    cursor =
      match.index + match[0].length;
  }

  html +=
    escapeHtml((text || "").slice(cursor));

  return html;

}

function formatAlertTimestamp(timestamp) {

  if (!timestamp) {
    return "";
  }

  const date =
    new Date(timestamp);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleString([], {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });

}

function formatAlertTimingDate(timestamp) {

  if (!timestamp) {
    return "";
  }

  const date =
    new Date(timestamp);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  const day =
    date.toLocaleDateString([], {
      weekday: "long",
      month: "short",
      day: "numeric"
    });
  const time =
    date.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  return `${day} at ${time}`;

}

function formatAlertTiming(alert) {

  const start =
    formatAlertTimingDate(alert?.timestamp);
  const end =
    formatAlertTimingDate(alert?.endTimestamp);
  const label =
    String(alert?.timestampLabel || "").replace(/^MTA\s+/i, "");
  const normalizedLabel =
    label || (start ? "Since" : "");
  const parts = [];

  if (start && normalizedLabel) {
    parts.push(`${normalizedLabel} ${start}`);
  }

  if (end) {
    parts.push(`Ends ${end}`);
  }

  return parts.join(" • ");

}

function formatLookAheadOccurrence(occurrence) {

  const start =
    formatAlertTimingDate(occurrence?.start);
  const end =
    formatAlertTimingDate(occurrence?.end);

  if (start && end) {
    return `${start} to ${end}`;
  }

  return start;

}

function formatLookAheadTiming(alert) {

  const occurrences =
    (alert.occurrences || [])
      .map(formatLookAheadOccurrence)
      .filter(Boolean);

  if (occurrences.length > 1) {
    return `Upcoming: ${occurrences.join("; ")}`;
  }

  if (occurrences.length === 1) {
    return formatAlertTiming(alert);
  }

  return formatAlertTiming(alert);

}

function directionsUrlForArrival(group) {

  const lat =
    Number(group.lat);
  const lon =
    Number(group.lon);

  if (Number.isFinite(lat) && Number.isFinite(lon)) {
    return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${lat},${lon}`)}&travelmode=transit`;
  }

  const query =
    `${group.station || "subway station"} NYC subway`;

  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;

}

      const panel =
        document.getElementById(`${direction}AlertPanel`);

      if (panel) {
        panel.classList.toggle("is-open");
        if (panel.classList.contains("is-open")) {
          openAlertDirections.add(direction);
        } else {
          openAlertDirections.delete(direction);
        }
      }
    });

    button.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        button.click();
      }
    });
  });

}

function attachRouteAlertHandlers() {

  document.querySelectorAll(".route-alert-route-group").forEach(button => {
    button.addEventListener("click", () => {
      const nextRoute =
        button.dataset.routeId || selectedRoute;
      const nextStop =
        button.dataset.stopId || selectedStopBase;

      if (sameSelection(currentSelection(), {
        branch: "",
        route: nextRoute,
        stop: nextStop
      })) {
        return;
      }

      rememberCurrentSelection();
      selectedRoute =
        nextRoute;
      selectedStopBase =
        nextStop;
      routeWasProvided =
        true;
      selectedBranchKey =
        "";

      applySelectionToUrl();

      loadArrivals();
    });
  });

}

async function loadArrivals(options = {}) {

  const preserveScroll =
    options.preserveScroll === true;

  if (loadInFlight) {
    queuedLoadOptions =
      preserveScroll ? { preserveScroll: true } : {};

    if (!preserveScroll) {
      loadSequence++;
    }

    return;
  }

  loadInFlight =
    true;
  const loadId =
    ++loadSequence;
  const startingSelectionKey =
    selectionKey();

  try {
    const previousScrollTop =
      preserveScroll ? currentScrollTop() : 0;
    const restoreScroll = () => {
      if (!preserveScroll) {
        return;
      }

      restoreDocumentScrollTop(previousScrollTop);
    };

    if (!selectedStopBase) {
      resultsEl.innerHTML = `
        <div class="message-card">Add a stop query parameter to show arrivals.</div>
      `;
      restoreScroll();
      return;
    }

    // Realtime refresh stabilization for Glide/iOS: keep the last good board
    // visible while the next complete payload is fetched in the background.
    const {
      uptownStop,
      downtownStop
    } = getDirectionStops(selectedStopBase);

    let [uptownPayload, downtownPayload, transferGroups, uptownAlerts, downtownAlerts] = await Promise.all([
      fetchDirection(uptownStop),
      fetchDirection(downtownStop),
      fetchTransfers(uptownStop),
      fetchServiceAlerts("N", uptownStop),
      fetchServiceAlerts("S", downtownStop)
    ]);

    let uptownArrivals =
      uptownPayload;
    let downtownArrivals =
      downtownPayload;

    const [uptownAvailability, downtownAvailability] =
      await Promise.all([
        platformAvailabilityState(uptownStop, uptownAlerts),
        platformAvailabilityState(downtownStop, downtownAlerts)
      ]);

    if (vehicleProofQuarantineEnabled) {
      [uptownPayload, downtownPayload] = await Promise.all([
        vehicleProofArrivals(
          uptownStop,
          uptownPayload,
          uptownAvailability
        ),
        vehicleProofArrivals(
          downtownStop,
          downtownPayload,
          downtownAvailability
        )
      ]);
    }

    if (arrivalProofGateEnabled) {
      [uptownPayload, downtownPayload] = await Promise.all([
        arrivalProofArrivals(
          uptownStop,
          uptownPayload,
          uptownAvailability
        ),
        arrivalProofArrivals(
          downtownStop,
          downtownPayload,
          downtownAvailability
        )
      ]);
      uptownArrivals = uptownPayload.arrivals;
      downtownArrivals = downtownPayload.arrivals;
    }

    if (departureProofLockEnabled) {
      [uptownArrivals, downtownArrivals] = await Promise.all([
        departureProofArrivals(
          uptownStop,
          uptownPayload,
          uptownAvailability
        ),
        departureProofArrivals(
          downtownStop,
          downtownPayload,
          downtownAvailability
        )
      ]);
    } else if (platformAlertSuppressionEnabled) {
      const {
        filterPlatformUnavailableArrivals
      } = await platformAlertModulePromise;

      uptownArrivals =
        filterPlatformUnavailableArrivals(
          uptownAvailability,
          uptownArrivals
        );
      downtownArrivals =
        filterPlatformUnavailableArrivals(
          downtownAvailability,
          downtownArrivals
        );
    }

    const groupedUptown =
      groupArrivals(uptownArrivals);

    const groupedDowntown =
      groupArrivals(downtownArrivals);

    if (loadId !== loadSequence) {
      restoreScroll();
      return;
    }

    if (
      preserveScroll &&
      hasRenderedArrivals &&
      startingSelectionKey === lastSuccessfulSelectionKey &&
      !groupedUptown.length &&
      !groupedDowntown.length
    ) {
      restoreScroll();
      return;
    }

    if (!routeWasProvided && !selectedRoute) {
      selectedRoute =
        firstDisplayedRoute(groupedUptown, groupedDowntown);
    }

const [uptownStationData, downtownStationData] =
  await Promise.all([
    fetchStations("N", uptownStop),
    fetchStations("S", downtownStop)
  ]);

if (loadId !== loadSequence) {
  restoreScroll();
  return;
}

const resolvedBranchKey =
  uptownStationData.branchKey ||
  downtownStationData.branchKey;

selectedBranchKey =
  resolvedBranchKey;

const resolvedRoute =
  uptownStationData.routeId ||
  downtownStationData.routeId;
const currentParams =
  new URLSearchParams(window.location.search);

if (
  (resolvedRoute && resolvedRoute !== selectedRoute) ||
  currentParams.get("stop") !== selectedStopBase ||
  currentParams.get("branch") !== selectedBranchKey
) {
  const nextParams = new URLSearchParams(window.location.search);
  nextParams.set("stop", selectedStopBase);

  if (selectedBranchKey) {
    nextParams.set("branch", selectedBranchKey);
  } else {
    nextParams.delete("branch");
  }

  if (resolvedRoute) {
    nextParams.set("route", resolvedRoute);
  }

  window.history.replaceState(null, "", `${window.location.pathname}?${nextParams.toString()}`);
}

if (resolvedRoute && resolvedRoute !== selectedRoute) {
  selectedRoute = resolvedRoute;
}

const routeAlertDataRaw =
  await fetchRouteAlerts(selectedRoute);

if (loadId !== loadSequence) {
  restoreScroll();
  return;
}

latestAlerts = {
  N: uptownAlerts,
  S: downtownAlerts
};

const routeAlertData =
  routeAlertsWithPlatformFallback(routeAlertDataRaw, [uptownAlerts, downtownAlerts], selectedRoute);

resultsEl.innerHTML = renderShell(groupedUptown, groupedDowntown, transferGroups, latestAlerts, routeAlertData);

populateSelectedStationHero(
  uptownStationData.currentStation ? uptownStationData : downtownStationData
);

populateStationRouteButtons(
  "uptownRouteSwitcher",
  uptownStationData.routes
);

populateStationRouteButtons(
  "downtownRouteSwitcher",
  downtownStationData.routes
);

populateStationBranchButtons(
  "uptownBranchSwitcher",
  uptownStationData.branches,
  uptownStationData.branchKey
);

populateStationBranchButtons(
  "downtownBranchSwitcher",
  downtownStationData.branches,
  downtownStationData.branchKey
);

populateStationSelect(
  "uptownSelect",
  uptownStationData.stations,
  uptownStop,
  uptownStationData.currentStation
);

populateStationSelect(
  "downtownSelect",
  downtownStationData.stations,
  downtownStop,
  downtownStationData.currentStation
);

if (openStationSelectId) {
  openStationSelect(openStationSelectId);
}

attachTransferHandlers();
attachDirectionsHandlers();
attachAlertHandlers();
attachRouteAlertHandlers();
hasRenderedArrivals =
  true;
lastSuccessfulSelectionKey =
  selectionKey();
restoreScroll();
  }

  catch(err) {

    if (!hasRenderedArrivals) {
      resultsEl.innerHTML = `
        <div class="message-card">Error loading arrivals. Please try again in a moment.</div>
      `;
    } else {
      console.warn("Keeping previous arrivals after refresh failed.", err);
    }

  }
  finally {
    loadInFlight =
      false;

    if (queuedLoadOptions) {
      const nextOptions =
        queuedLoadOptions;
      queuedLoadOptions =
        null;
      loadArrivals(nextOptions);
    }
  }

}

window.addEventListener("touchstart", () => {
  activeTouchCount += 1;
  markTouchScrollActive();
}, { passive: true });

window.addEventListener("touchmove", markTouchScrollActive, { passive: true });

window.addEventListener("touchend", () => {
  activeTouchCount =
    Math.max(0, activeTouchCount - 1);
  markTouchScrollActive();
}, { passive: true });

window.addEventListener("touchcancel", () => {
  activeTouchCount =
    0;
  markTouchScrollActive();
}, { passive: true });

loadArrivals();

setInterval(() => {
  // Glide/iOS scroll stability: avoid background refresh scroll restoration while
  // the user's finger is actively driving the iframe scroll surface.
  if (!isStationMenuOpen() && !isTouchScrollActive()) {
    loadArrivals({ preserveScroll: true });
  }
}, 15000);
</script>
</body>
</html>
