<!DOCTYPE html>
<html>
<head>
  <title>Commuter Eye Arrivals</title>
</head>

<body style="
  margin:0;
  background:#111;
  font-family:Arial;
  color:white;
">



 <div id="results" style="
  padding:10px 12px;
">
Loading arrivals...
</div>

<script>
const params = new URLSearchParams(window.location.search);

const stop = params.get("stop");
const route = params.get("route");

function loadArrivals() {

fetch(`/push-arrivals?platformId=${stop}&routeId=${route}`)
  .then(res => res.json())
  .then(data => {

 let grouped = {};

data.arrivals.forEach(arrival => {

  if (!grouped[arrival.route]) {
    grouped[arrival.route] = [];
  }

  grouped[arrival.route].push(arrival.time);

});
let html = "";

Object.keys(grouped).forEach(route => {

  html += `

    <div style="
      background:#1A1A1D;
     border-radius:14px;
     padding:14px 14px;
     margin-bottom:8px;
    ">

      <div style="
        display:flex;
        align-items:center;
      ">

        <div style="
          width:44px;
          height:44px;
          border-radius:50%;
          background:${route === "2" ? "#EE352E" :
                      route === "3" ? "#EE352E" :
                      route === "4" ? "#00933C" :
                      route === "5" ? "#00933C" :
                      route === "6" ? "#00933C" :
                      "#444"};

          color:white;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:24px;
          font-weight:bold;
          margin-right:14px;
          flex-shrink:0;
        ">
          ${route}
        </div>

        <div style="
          font-size:24px;
          font-weight:600;
          line-height:1.2;
          color:white;
          letter-spacing:0.5px;
        ">
          ${grouped[route].join(" • ")} min
        </div>

      </div>

    </div>

  `;

});

document.getElementById("results").innerHTML = html;

})
  .catch(err => {
    document.getElementById("results").innerHTML =
      "Error loading arrivals";
  });
  }

loadArrivals();

setInterval(loadArrivals, 15000);
</script>

</body>
</html>
